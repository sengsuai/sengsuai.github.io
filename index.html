<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>贝勒府进销存</title>
<script src="https://fastly.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --red:#8C1C13; --red-dark:#6E140E; --gold:#D4A84B; --gold-soft:#F3E4C2;
  --bg:#FAF7F2; --card:#FFFFFF; --line:#E8DFD2; --ink:#241C16; --ink2:#7A6A5C;
  --ok:#1F7A4D; --warn:#B5651D; --err:#B02A1D;
  --radius:14px; --shadow:0 2px 10px rgba(74,43,20,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--red);text-decoration:none}
.hide{display:none!important}

/* ---------- 登录 ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 10%,#8C1C13 0%,#5E1009 55%,#2C0705 100%);z-index:50}
.login-art{position:absolute;inset:0;width:100%;height:100%;opacity:.10;pointer-events:none}
.login-art2{position:absolute;left:-10%;bottom:-16%;width:min(38vw,360px);opacity:.09;pointer-events:none}
.fa-cai{position:absolute;right:6%;top:6%;font-family:"Songti SC","STSong","SimSun",serif;font-weight:800;
  font-size:clamp(72px,15vw,150px);line-height:1;letter-spacing:.08em;color:#F2CE86;opacity:.22;
  text-shadow:0 0 30px rgba(212,168,75,.5);pointer-events:none;user-select:none;text-align:right}
.fa-cai small{display:block;font-size:.16em;letter-spacing:.24em;opacity:.9;margin-top:.55em;text-align:right;color:#E8C87A}
.login-card{position:relative;z-index:3;width:100%;max-width:380px;background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.brand-badge{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-weight:600;letter-spacing:.12em;font-size:12px}
.login-card h1{margin:10px 0 4px;font-size:24px;letter-spacing:.06em;color:var(--red)}
.login-card p{margin:0 0 18px;color:var(--ink2);font-size:12.5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px}
.input{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,168,75,.16)}
textarea.input{height:auto;padding:10px 12px;resize:vertical;min-height:64px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;
  border-radius:10px;border:1px solid transparent;background:var(--red);color:#fff;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold);color:#3A2A08}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn.danger{background:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.login-hint{margin-top:12px;font-size:12px;color:var(--ink2);text-align:center}

/* ---------- 布局 ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#8C1C13,#6E140E);color:#fff;
  padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header .logo{font-weight:700;letter-spacing:.06em;font-size:16px;white-space:nowrap}
header .logo small{display:block;font-size:9px;letter-spacing:.2em;color:var(--gold);font-weight:500}
.store-pick{margin-left:auto;display:flex;align-items:center;gap:6px}
.store-pick select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.24);
  border-radius:8px;height:32px;padding:0 8px;font-size:13px}
.store-pick select option{color:#241C16}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#3A2A08;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer}
/* 消息铃铛 */
.bell{position:relative;width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.14);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bell:active{transform:translateY(1px)}
.bell .badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--gold);color:#3A2A08;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.notice-row{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid #F1EAE0}
.notice-row:last-child{border-bottom:0}
.notice-row .ic2{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:13px;flex:0 0 auto;background:#FCF8F1;color:var(--ink2)}
.notice-row.unread .ic2{background:rgba(140,28,19,.08);color:var(--red)}
.notice-row .body{flex:1;min-width:0}
.notice-row .body b{font-size:13px;display:block}
.notice-row .body small{font-size:11.5px;color:var(--ink2);display:block;margin-top:2px;white-space:normal}
.notice-row .t{font-size:11px;color:#A99C8F;white-space:nowrap}
.shell{flex:1;display:flex;min-height:0}
aside{display:none}
main{flex:1;padding:14px;padding-bottom:86px;max-width:1180px;margin:0 auto;width:100%}
@media (min-width:900px){
  aside{display:block;width:212px;background:#fff;border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
  main{padding:18px 22px 30px}
  header{padding:10px 18px}
  .tabbar{display:none!important}
}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;color:var(--ink2);cursor:pointer;font-size:13.5px;margin-bottom:2px}
.nav-item.on{background:linear-gradient(135deg,rgba(140,28,19,.09),rgba(212,168,75,.13));color:var(--red);font-weight:600}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(74,43,20,.06)}
.tabbar div{flex:1;text-align:center;padding:4px 0;color:var(--ink2);font-size:11px;cursor:pointer}
.tabbar div .ic{display:block;font-size:19px;line-height:1.1}
.tabbar div.on{color:var(--red);font-weight:600}

/* ---------- 通用 ---------- */
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:19px;letter-spacing:.02em}
.page-head .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--ink2);font-weight:600;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow)}
.kpi .t{font-size:11.5px;color:var(--ink2)}
.kpi .v{font-size:23px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;color:var(--ink2);font-weight:400;margin-left:3px}
.kpi.warn .v{color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar .input,.toolbar select{height:38px}
.toolbar .input{flex:1;min-width:140px}
select.inp,input.inp{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;outline:none;min-width:0}
select.inp:focus,input.inp:focus{border-color:var(--gold)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #F1EAE0;font-size:13px;white-space:nowrap}
th{background:#FCF8F1;color:var(--ink2);font-weight:600;font-size:12px}
td.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}                         /* 数字列表头与数字对齐 */
.qty-cell{display:inline-flex;align-items:center;gap:5px;justify-content:flex-end}
.qty-cell .inp{width:80px;text-align:right;height:32px}
.qty-cell span{font-size:11.5px;color:var(--ink2);white-space:nowrap}
td .inp[type=date]{height:32px}
th:first-child,td:first-child{border-left:0}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;line-height:1.8}
.tag.ok{background:#E7F4EC;color:var(--ok)}
.tag.warn{background:#FBEDDD;color:var(--warn)}
.tag.err{background:#FBE6E3;color:var(--err)}
.tag.gray{background:#F0EBE4;color:var(--ink2)}
.empty{padding:36px 12px;text-align:center;color:var(--ink2);font-size:13px}
.empty.tight{padding:18px 12px}
.dual{display:grid;gap:0}
@media (min-width:900px){.dual{grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
.empty .big{font-size:30px;display:block;margin-bottom:8px;opacity:.4}

/* ---------- 弹窗 ---------- */
#modal{position:fixed;inset:0;z-index:40;display:none}
#modal.on{display:block}
.mask{position:absolute;inset:0;background:rgba(30,16,8,.5)}
.modal-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 28px);max-width:520px;
  max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
@media (max-width:600px){.modal-panel{top:auto;bottom:0;transform:translateX(-50%);border-radius:16px 16px 0 0;max-height:90vh}}
.modal-panel h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center}
.modal-panel h3 .sp{flex:1}
.x{border:0;background:transparent;font-size:20px;color:var(--ink2);cursor:pointer;line-height:1}
.form-row{display:grid;gap:10px;margin-bottom:10px}
.form-row.two{grid-template-columns:1fr 1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
@media (max-width:560px){.form-row.three{grid-template-columns:1fr 1fr}}
.modal-foot{display:flex;gap:8px;margin-top:14px}
.modal-foot .btn{flex:1}

/* ---------- 扫码 ---------- */
#scanner{position:fixed;inset:0;z-index:60;display:none;background:#000;color:#fff}
#scanner.on{display:block}
#scanVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transition:opacity .2s}
.scan-top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top))}
.scan-top .sp{flex:1}
.scan-top button{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer}
.frame{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:74%;max-width:330px;aspect-ratio:1/1;z-index:2;pointer-events:none}
.frame i{position:absolute;width:30px;height:30px;border:3px solid var(--gold)}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 6px}
.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 6px 0}
.laser{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  box-shadow:0 0 10px var(--gold);animation:laser 2s ease-in-out infinite}
@keyframes laser{0%,100%{top:8%}50%{top:92%}}
.scan-bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;color:var(--ink);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}
.scan-bottom .row{display:flex;gap:8px;align-items:center}
.scan-debug{margin-top:6px;font-size:10px;color:#9a8f83;line-height:1.5;word-break:break-all;font-family:ui-monospace,monospace}
.scan-tip{text-align:center;color:rgba(255,255,255,.8);font-size:13px;margin-bottom:8px}
.scan-fail{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px}
.scan-fail .box{background:#fff;color:var(--ink);border-radius:14px;padding:20px;max-width:360px;width:100%}
.scan-fail .box h4{margin:0 0 8px;font-size:16px;color:var(--err);display:flex;gap:6px;align-items:center}
.scan-fail .box p{margin:0 0 6px;font-size:13px;color:var(--ink2);line-height:1.6}
.scan-fail .box .code{font-size:11px;color:#a99c8f;word-break:break-all;margin-bottom:14px}
.scan-fail .box .btn{margin-bottom:8px}
.scan-busy{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.35)}
.spinner{width:34px;height:34px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 条码标签 ---------- */
.label-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:700px){.label-grid{grid-template-columns:repeat(3,1fr)}}
.label{border:1px dashed #D9CBB8;border-radius:8px;padding:6px;background:#fff;text-align:center;overflow:hidden}
.label .pn{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .ps{font-size:10px;color:var(--ink2)}
.label .bc{width:100%;height:auto;display:block;overflow:hidden;margin:2px 0}
.label .bc svg{display:block;width:100%;height:auto}
.label canvas{max-width:100%;width:100%;height:auto;image-rendering:pixelated}
@media print{
  @page{size:A4 landscape;margin:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:0;margin:0}
  #printArea svg.a4sheet{display:block;width:297mm;height:auto;margin:0;page-break-after:always;break-after:page}
}
#printArea{display:none}

/* ---------- 小工具 ---------- */
.pill{display:inline-flex;gap:6px;align-items:center;background:#FCF8F1;border:1px solid var(--line);
  border-radius:20px;padding:4px 10px;font-size:12px;color:var(--ink2);cursor:pointer}
.pill.on{background:var(--gold-soft);border-color:var(--gold);color:#6B4E08;font-weight:600}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.bar-chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar-chart .in{width:100%;background:linear-gradient(180deg,#C0392B,#8C1C13);border-radius:4px 4px 0 0;min-height:2px}
.bar-chart .out{width:100%;background:linear-gradient(180deg,#E4C88A,#D4A84B);border-radius:4px 4px 0 0;min-height:2px}
.bar-chart .lb{font-size:10px;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin-top:6px}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.flow{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F3ECE2}
.list-item:last-child{border-bottom:0}
.list-item .g{flex:1;min-width:0}
.list-item .g b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .g small{color:var(--ink2);font-size:11.5px}
</style>
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login">
  <svg class="login-art" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <g id="potArt" fill="none" stroke="#F0D08A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="0" cy="0" rx="56" ry="14"/>
        <path d="M-54 2c1 30 23 55 54 55s53-25 54-55"/>
        <path d="M-54 16c-9 2-9 16 6 16"/>
        <path d="M54 16c9 2 9 16-6 16"/>
        <path d="M-20-26c11-9-9-17 2-30"/>
        <path d="M2-30c11-9-9-17 2-30"/>
        <path d="M24-26c11-9-9-17 2-30"/>
        <path d="M-34 8h68"/>
      </g>
      <g id="coinArt" fill="none" stroke="#F0D08A" stroke-width="3">
        <circle cx="0" cy="0" r="18"/>
        <path d="M0-12v24M-6-6h12M-6 4h12"/>
      </g>
    </defs>
    <use href="#potArt" xlink:href="#potArt" transform="translate(96,150) scale(.62)"/>
    <use href="#potArt" xlink:href="#potArt" transform="translate(330,310) scale(.5)"/>
    <use href="#potArt" xlink:href="#potArt" transform="translate(64,52) scale(.3)"/>
    <use href="#coinArt" xlink:href="#coinArt" transform="translate(362,206) scale(.9)"/>
    <use href="#coinArt" xlink:href="#coinArt" transform="translate(28,336) scale(.8)"/>
    <path d="M40 236l8-8 8 8-8 8z" fill="none" stroke="#F0D08A" stroke-width="2.6" opacity=".8"/>
  </svg>
  <svg class="login-art2" viewBox="0 0 300 300" aria-hidden="true">
    <g fill="none" stroke="#D4A84B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="150" cy="170" rx="108" ry="34"/>
      <path d="M42 170c4 52 46 86 108 86s104-34 108-86"/>
      <path d="M42 170c-22 2-22 30 8 30"/>
      <path d="M258 170c22 2 22 30-8 30"/>
      <path d="M118 130c18-16-14-30 4-52"/>
      <path d="M150 126c18-16-14-30 4-52"/>
      <path d="M182 130c18-16-14-30 4-52"/>
      <circle cx="118" cy="186" r="8" fill="#D4A84B" stroke="none"/>
      <circle cx="168" cy="196" r="7" fill="#D4A84B" stroke="none"/>
      <circle cx="198" cy="182" r="6" fill="#D4A84B" stroke="none"/>
    </g>
  </svg>
  <div class="fa-cai">发财<small>财 源 滚 滚 · 生 意 兴 隆</small></div>
  <div class="login-card">
    <span class="brand-badge">◈ 贝勒府 · 进销存</span>
    <h1>贝勒府进销存</h1>
    <p>多门店 · 多仓库 · 扫码出入库 · 盘点预警</p>
    <div class="field"><label>账号</label><input id="lgUser" class="input" placeholder="请输入账号" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="lgPass" class="input" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <button class="btn block" id="lgBtn">登 录</button>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="hide">
  <header>
    <div class="logo">贝勒府进销存<small>BEI LE FU · INVENTORY</small></div>
    <div class="store-pick">
      <select id="storeSel"></select>
      <button class="bell" id="bellBtn" aria-label="消息通知">🔔<span class="badge" id="bellBadge" style="display:none">0</span></button>
      <div class="avatar" id="avatar">管</div>
    </div>
  </header>
  <div class="shell">
    <aside id="side"></aside>
    <main id="view"></main>
  </div>
  <div class="tabbar" id="tabbar"></div>
</div>

<div id="modal"><div class="mask"></div><div class="modal-panel" id="modalPanel"></div></div>

<!-- ============ 扫码 ============ -->
<div id="scanner">
  <video id="scanVideo" playsinline muted autoplay></video>

/* =========================================================================
   云同步：把整份数据存到 GitHub Gist（私有），手机电脑各设备填同一组
   Token + Gist ID，即可共用一份库存
   ========================================================================= */
const CKEY='blf_cloud_v1';
const GFILE='beilefu.json';
function cloudCfg(){
  let o={};
  try{ o=JSON.parse(localStorage.getItem(CKEY)||'{}')||{}; }catch(e){ o={}; }
  if(o.enable===false) return o;              // 用户主动断开过，不再自动填
  if(!o.backend) o.backend='supabase';
  if(!o.sbUrl||!/\.supabase\.co/.test(o.sbUrl)) o.sbUrl=SB_DEFAULT_URL;
  if(!o.sbKey||o.sbKey.length<30||/…|\.\.\./.test(o.sbKey)) o.sbKey=SB_DEFAULT_KEY;   // 防截断的假 Key
  if(!o.room) o.room=SB_DEFAULT_ROOM;
  if(o.auto===undefined) o.auto=true;
  return o;
}
function cloudSet(patch){ const c=Object.assign(cloudCfg(),patch); localStorage.setItem(CKEY,JSON.stringify(c)); return c; }
function cloudReady(){
  const c=cloudCfg();
  return c.backend==='supabase' ? !!(c.sbUrl&&c.sbKey&&c.room) : !!(c.token&&c.gist);
}
/* ---------- Supabase（免费 Postgres，国内可用，手机电脑共用） ---------- */
const SB_DEFAULT_URL='https://wfqaqdbkpkcrrpexwptw.supabase.co';
const SB_DEFAULT_KEY='sb_publishable_SCqEz2yIqCOpwdgpQzVn4A_SK94PTFS';
const SB_DEFAULT_ROOM='blf-7k29xq4m';
function sbHeaders(){
  const c=cloudCfg();
  return {'apikey':c.sbKey,'Authorization':'Bearer '+c.sbKey,'Content-Type':'application/json'};
}
async function sbFetch(path,opt){
  const c=cloudCfg();
  const base=(c.sbUrl||SB_DEFAULT_URL).replace(/\/+$/,'');
  const o=Object.assign({},opt||{});
  o.headers=Object.assign(sbHeaders(),(opt&&opt.headers)||{});
  let r;
  try{ r=await fetch(base+'/rest/v1/'+path,o); }
  catch(e){ throw new Error('连不上 Supabase（检查网络，或项目是否被暂停）'); }
  if(r.status===401||r.status===403){
    const t=await r.text().catch(()=>'');
    throw new Error(r.status===401?'Key 不对或没带上（要用 sb_publishable_ 开头那串）':'没有权限（检查 RLS 策略）'+(t?('：'+t.slice(0,120)):''));
  }
  if(r.status===404){
    const t=await r.text().catch(()=>'');
    throw new Error('表 blf_docs 不存在或未开放给 API：'+(t.slice(0,120)||'先去 SQL Editor 跑建表语句'));
  }
  if(!r.ok){
    const t=await r.text().catch(()=>'');
    throw new Error('Supabase 返回 '+r.status+'：'+t.slice(0,160));
  }
  return r;
}
async function sbGetRaw(){
  const c=cloudCfg();
  const room=c.room||SB_DEFAULT_ROOM;
  const r=await sbFetch('blf_docs?room=eq.'+encodeURIComponent(room)+'&select=payload,updated_at');
  const arr=await r.json();
  if(!arr||!arr.length) return null;
  const doc=arr[0].payload;
  if(!doc) return null;
  if(!doc._t&&arr[0].updated_at) doc._t=Date.parse(arr[0].updated_at)||0;
  return doc;
}
/* 只取时间戳（响应体几十字节，比拉整份数据快几十倍） */
async function sbGetMeta(){
  const c=cloudCfg();
  const room=c.room||SB_DEFAULT_ROOM;
  const r=await sbFetch('blf_docs?room=eq.'+encodeURIComponent(room)+'&select=updated_at');
  const arr=await r.json();
  if(!arr||!arr.length) return null;
  return Date.parse(arr[0].updated_at)||0;
}
async function sbPutRaw(obj){
  const c=cloudCfg();
  const room=c.room||SB_DEFAULT_ROOM;
  const h=sbHeaders(); h['Prefer']='resolution=merge-duplicates';
  const r=await sbFetch('blf_docs?on_conflict=room',{
    method:'POST', headers:h,
    body:JSON.stringify({room,payload:obj,updated_at:new Date().toISOString()})
  });
  return r;
}
function ghHeaders(token){
  return {'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'};
}
async function ghJson(url,opt){
  let r;
  try{ r=await fetch(url,opt); }
  catch(e){ throw new Error('网络不通，无法访问 GitHub（检查网络或代理）'); }
  if(r.status===401) throw new Error('Token 无效或没勾选 Gists 权限');
  if(r.status===403) throw new Error('GitHub 拒绝访问（Token 权限不足或触发频率限制）');
  if(r.status===404) throw new Error('找不到该 Gist（检查 ID，或 Token 没有 gist 权限）');
  if(!r.ok) throw new Error('GitHub 返回 '+r.status);
  return r.json();
}
async function cloudGetRaw(){
  const c=cloudCfg();
  if(c.backend==='supabase') return sbGetRaw();
  const j=await ghJson('https://api.github.com/gists/'+c.gist,{headers:ghHeaders(c.token)});
  const f=j.files&&j.files[GFILE];
  if(!f) return null;
  let text=f.content;
  if(f.truncated&&f.raw_url){
    const rr=await fetch(f.raw_url);
    text=await rr.text();
  }
  try{ return JSON.parse(text); }catch(e){ return null; }
}
async function cloudPutRaw(obj){
  const c=cloudCfg();
  if(c.backend==='supabase') return sbPutRaw(obj);
  return ghJson('https://api.github.com/gists/'+c.gist,{
    method:'PATCH', headers:ghHeaders(c.token),
    body:JSON.stringify({description:'贝勒府进销存·自动同步',files:{[GFILE]:{content:JSON.stringify(obj)}}})
  });
}
let cpushTimer=null,cpushBusy=false,pendingPush=false;
function cloudSchedulePush(){
  if(!cloudReady()||!cloudCfg().auto) return;
  clearTimeout(cpushTimer);
  cpushTimer=setTimeout(()=>{ cloudPush(false); },2500);   // 改完 2.5 秒就推
}
/* 只问时间戳，不拉整份数据：Supabase 上一条查询只有几十字节 */
async function cloudStamp(){
  const c=cloudCfg();
  if(c.backend==='supabase') return sbGetMeta();
  const d=await cloudGetRaw();
  return d?(d._t||0):null;
}
async function cloudPush(force){
  if(!cloudReady()){ toast('还没配置云端同步','err'); return false; }
  if(!DB._t){ toast('本机还没有数据，请先点「从云端下载」','err'); return false; }
  if(cpushBusy){ pendingPush=true; return false; }
  cpushBusy=true;
  try{
    const stamp=await cloudStamp();
    if(!force&&stamp&&stamp>(DB._t||0)){
      toast('云端有更新的数据，已暂停上传。请点「从云端下载」','err');
      return false;
    }
    DB._t=Date.now();
    localStorage.setItem(KEY,JSON.stringify(DB));
    await cloudPutRaw(DB);
    cloudSet({lastAt:Date.now()});
    return true;
  }catch(e){ toast('上传失败：'+e.message,'err'); return false; }
  finally{
    cpushBusy=false;
    if(pendingPush){ pendingPush=false; setTimeout(()=>cloudPush(false),1500); }  // 上传中又改了，补一次
  }
}
function applyRemote(remote){
  localStorage.setItem(KEY+'_prev',JSON.stringify(DB));   // 覆盖前留一份，出问题可回退
  DB=remote;
  localStorage.setItem(KEY,JSON.stringify(DB));
  const s=JSON.parse(localStorage.getItem(SESSION)||'null');
  CUR=s?DB.users.find(u=>u.id===s.id&&u.active):null;
  const cs=localStorage.getItem(KEY+'_store');
  currentStoreId=(DB.stores.find(x=>x.id===cs)||DB.stores[0]||{}).id;
  clampStore();
  cloudSet({lastAt:Date.now()});
}
async function cloudPull(force){
  if(!cloudReady()){ toast('还没配置云端同步','err'); return false; }
  try{
    const remote=await cloudGetRaw();
    if(!remote){ toast('云端还没有数据，先点「上传到云端」','err'); return false; }
    if(!force&&(DB._t||0)>(remote._t||0)){
      toast('本机数据比云端新，未下载（确实要用云端覆盖本机，请「强制下载」）','err'); return false;
    }
    applyRemote(remote);
    toast('已从云端下载最新数据');
    if(CUR){ renderStoreSel(); render(); } else { init(); }
    return true;
  }catch(e){ toast('下载失败：'+e.message,'err'); return false; }
  finally{ renderCloudCard(); }
}
async function cloudCreate(){
  const c=cloudCfg();
  if(!c.token){ toast('先填 GitHub Token','err'); return; }
  try{
    const payload=DB._t?DB:Object.assign({},DB,{_t:Date.now()});
    const j=await ghJson('https://api.github.com/gists',{
      method:'POST', headers:ghHeaders(c.token),
      body:JSON.stringify({description:'贝勒府进销存·自动同步',public:false,
        files:{[GFILE]:{content:JSON.stringify(payload)}}})
    });
    cloudSet({gist:j.id,auto:true,lastAt:Date.now()});
    toast('云端已创建，Gist ID：'+j.id);
    renderCloudCard();
  }catch(e){ toast('创建失败：'+e.message,'err'); }
}
async function cloudAutoStart(){
  if(!cloudReady()||!cloudCfg().auto) return;
  try{
    const remote=await cloudGetRaw();
    if(!remote||!remote.products){
      // 云端还是空的：把本机现有数据先传上去（这台就是“主设备”）
      if(DB&&DB._t&&DB.products&&DB.products.length){ await cloudPush(true); }
      return;
    }
    if((remote._t||0)>(DB._t||0)){
      applyRemote(remote);
      toast('已自动同步云端最新数据');
    }else if((DB._t||0)>(remote._t||0)&&DB.products&&DB.products.length){
      await cloudPush(true);
    }
  }catch(e){ /* 启动时静默失败，不打扰 */ }
}

/* 设置页卡片 */
function renderCloudCard(){
  const box=document.getElementById('cloudBody'); if(!box) return;
  const c=cloudCfg();
  const mode=c.backend==='gist'?'gist':'supabase';

async function cloudPullConnect(){
  try{
    const remote=await cloudGetRaw();
    if(!remote||!remote.products){
      toast('连接成功，但云端还没有数据；点「上传到云端」把本机数据传上去');
      renderCloudCard(); return;
    }
    const n=remote.products.length;
    if(confirm('云端已有数据（'+n+' 个商品）。\n\n确定 = 下载云端数据到本机\n取消 = 保持本机数据不变')){
      applyRemote(remote);
      toast('已下载云端数据');
      if(CUR){ renderStoreSel(); render(); } else { init(); }
    }
  }catch(e){ toast('连接失败：'+e.message,'err'); }
  finally{ renderCloudCard(); }
}
function store(id){ return DB.stores.find(s=>s.id===id); }
function wh(id){ return DB.warehouses.find(w=>w.id===id); }
function prod(id){ return DB.products.find(p=>p.id===id); }
function whsOf(storeId){ return DB.warehouses.filter(w=>w.storeId===storeId); }
function stockKey(whId,pid){ return whId+'|'+pid; }
function qtyOf(whId,pid){ const r=DB.stock[stockKey(whId,pid)]; return r?r.qty:0; }
function qtyInStore(storeId,pid){
  return whsOf(storeId).reduce((a,w)=>a+qtyOf(w.id,pid),0);
}
function setQty(whId,pid,delta,opt){
  const k=stockKey(whId,pid); const r=DB.stock[k]||{qty:0,cost:prod(pid)?.cost||0};
  r.qty=Math.round((r.qty+delta)*1000)/1000;
  if(r.qty<=0){ r.qty=0; }
  DB.stock[k]=r;
  // 批次联动：进则加批次，出则先进先出（按到期日最早的先扣）
  if(delta>0){ if(!(opt&&opt.silent)) addBatch(whId,pid,delta,opt||{}); }
  else if(delta<0){
    const moved=consumeBatches(whId,pid,-delta);
    if(opt&&opt.toWh) moved.forEach(m=>addBatch(opt.toWh,pid,m.qty,m));   // 调拨：批次跟着走
  }
}
/* ---------- 批次 / 保质期 ---------- */
function batchesOf(whId,pid){
  return (DB.batches||[]).filter(b=>b.whId===whId&&b.pid===pid&&b.qty>0);
}
function addBatch(whId,pid,qty,o){
  if(!(qty>0)) return;
  DB.batches=DB.batches||[];
  DB.batches.push({id:uid('bt'),whId,pid,qty:Math.round(qty*1000)/1000,qty0:Math.round(qty*1000)/1000,
    prod:o.prod||'',exp:o.exp||'',no:o.no||'',date:nowStr()});
}
function consumeBatches(whId,pid,q){
  let left=q; const moved=[];
  const list=batchesOf(whId,pid).slice().sort((a,b)=>{
    const ea=a.exp||'9999-12-31', eb=b.exp||'9999-12-31';
    return ea<eb?-1:ea>eb?1:0;                     // 先到期的先出
  });
  for(const b of list){
    if(left<=0) break;
    const take=Math.min(b.qty,left);
    b.qty=Math.round((b.qty-take)*1000)/1000;
    left=Math.round((left-take)*1000)/1000;
    moved.push({qty:take,exp:b.exp||'',prod:b.prod||'',no:b.no||''});
  }
  DB.batches=(DB.batches||[]).filter(b=>b.qty>0.0001);
  return moved;
}
function daysLeft(exp){
  if(!exp) return null;
  const d=new Date(exp+'T00:00:00');
  if(isNaN(d)) return null;
  const t0=new Date(today()+'T00:00:00');
  return Math.round((d-t0)/86400000);
}
/* 本地时区的 yyyy-mm-dd（不能用 toISOString，会因时区差一天） */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(dateStr,days){
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d)||!days) return '';
  d.setDate(d.getDate()+Number(days));
  return ymd(d);
}
/* 把 2026/11/20、2026.11.20、11月20日、11/22 之类统一成 2026-11-20 */
function normDate(s){
  s=String(s||'').trim();
  if(!s) return '';
  s=s.replace(/[年月]/g,'-').replace(/日/g,'').replace(/[./]/g,'-');
  const m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  const md=s.match(/^(\d{1,2})-(\d{1,2})(?:-?)$/);            // 只有月日：按今年算
  if(md) return `${today().slice(0,4)}-${String(md[1]).padStart(2,'0')}-${String(md[2]).padStart(2,'0')}`;
  const d=new Date(s);
  if(!isNaN(d)) return ymd(d);
  return '';
}

/* ---------- 门店授权：用户只看得见、进得去自己负责的门店 ---------- */
function storesOfUser(u){
  const list=DB.stores.filter(s=>s.active);
  if(!u) return list;
  const r=roleOf(u);
  if(r&&r.id==='role_admin') return list;          // 管理员永远全部门店
  const s=u.stores;
  if(!s||!s.length||s.includes('*')) return list;  // 没设限制 = 全部门店
  return list.filter(x=>s.includes(x.id));
}
function canStore(id){ return storesOfUser(CUR).some(s=>s.id===id); }

/* 该门店里「能管这事」的人：库管 / 店长 / 管理员 */
function staffOfStore(storeId,perm){
  return DB.users.filter(u=>{
    if(!u.active) return false;
    const r=roleOf(u); if(!r) return false;
    if(r.id==='role_admin') return true;
    if(perm&&!r.perms.includes(perm)) return false;
    const s=u.stores;
    return !s||!s.length||s.includes('*')||s.includes(storeId);
  });
}

}

function clampStore(){
  const list=storesOfUser(CUR);
  if(!list.length){ currentStoreId=null; return false; }
  if(!list.some(s=>s.id===currentStoreId)){
    currentStoreId=list[0].id;
    localStorage.setItem(KEY+'_store',currentStoreId);
  }
  return true;
}
function nextNo(kind){
  const s=DB.seq||(DB.seq={in:1,out:1,st:1,tr:1});
  const pre={in:'RK',out:'CK',st:'PD',tr:'DB'}[kind];
  const d=new Date();
  const no=pre+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(s[kind]++).padStart(4,'0');
  return no;
}

function renderLogin(){
  document.getElementById('login').classList.remove('hide');
  document.getElementById('app').classList.add('hide');
}
function doLogin(){
  const a=document.getElementById('lgUser').value.trim();
  const p=document.getElementById('lgPass').value;
  const u=DB.users.find(x=>x.account===a&&x.active);
  if(!u||u.pass!==p){ toast('账号或密码不正确','err'); return; }
  CUR=u; localStorage.setItem(SESSION,JSON.stringify({id:u.id}));
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');

function logout(){
  CUR=null; localStorage.removeItem(SESSION);

}
function renderStoreSel(){
  const sel=document.getElementById('storeSel');
  const list=storesOfUser(CUR);
  if(!list.length){
    sel.innerHTML='<option>无可用门店</option>'; sel.disabled=true; return;
  }
  sel.disabled=false;
  sel.innerHTML=list.map(s=>`<option value="${s.id}" ${s.id===currentStoreId?'selected':''}>${esc(s.name)}</option>`).join('');

function renderNav(){
  const items=PERMS.filter(([k])=>can(k));
  document.getElementById('side').innerHTML=items.map(([k,n,ic])=>
    `<div class="nav-item ${currentView===k?'on':''}" data-nav="${k}"><span class="ic">${ic}</span>${n}</div>`).join('')

  const tabs=[['dashboard','工作台','◧'],['inbound','入库','↓'],['outbound','出库','↑'],['stock','库存','☰']];

function bindNav(){
  document.addEventListener('click',e=>{
    const n=e.target.closest('[data-nav]');
    if(n){ go(n.dataset.nav); return; }
    if(e.target.closest('[data-logout]')){ logout(); return; }

function go(v){

function viewDashboard(el){
  const ws=whsOf(currentStoreId);
  const pids=new Set(); let totalQty=0,totalVal=0;
  ws.forEach(w=>DB.products.forEach(p=>{
    const q=qtyOf(w.id,p.id);
    if(q>0){ pids.add(p.id); totalQty+=q; totalVal+=q*(DB.stock[stockKey(w.id,p.id)].cost||p.cost); }
  }));
  const t=today();
  const todayIn=DB.stockIn.filter(d=>!d.void&&d.storeId===currentStoreId&&d.date.startsWith(t)).length;
  const todayOut=DB.stockOut.filter(d=>!d.void&&d.storeId===currentStoreId&&d.date.startsWith(t)).length;
  const alertList=DB.products.map(p=>({p,total:qtyInStore(currentStoreId,p.id),gap:p.safe-qtyInStore(currentStoreId,p.id)}))
    .filter(x=>x.total<x.p.safe).sort((a,b)=>b.gap-a.gap);

  // 7天趋势
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const inQ=DB.stockIn.filter(x=>!x.void&&x.storeId===currentStoreId&&x.date.startsWith(key))
      .reduce((a,x)=>a+x.items.reduce((b,i)=>b+i.qty,0),0);
    const outQ=DB.stockOut.filter(x=>!x.void&&x.storeId===currentStoreId&&x.date.startsWith(key))
      .reduce((a,x)=>a+x.items.reduce((b,i)=>b+i.qty,0),0);
    days.push({lb:(d.getMonth()+1)+'/'+d.getDate(),inQ,outQ});
  }
  const max=Math.max(1,...days.map(d=>Math.max(d.inQ,d.outQ)));
  const expRows=expiringRows(currentStoreId);
  const expBad=expRows.filter(r=>r.days<0);

  const exp30=expRows.filter(r=>r.days>=0&&r.days<=30);

  el.innerHTML=`

      <div class="kpi"><div class="t">今日入库单</div><div class="v">${todayIn}<small>单</small></div></div>
      <div class="kpi"><div class="t">今日出库单</div><div class="v">${todayOut}<small>单</small></div></div>
      <div class="kpi warn"><div class="t">预警商品</div><div class="v">${alertList.length}<small>项</small></div></div>
      <div class="kpi ${expRows.length?'warn':''}"><div class="t">临期预警批次</div><div class="v">${expRows.length}<small>批</small></div></div>
    </div>
    ${(()=>{const un=unreadOfMe(); if(!un.length) return '';
      return `<div class="card">
        <h3>未读消息 <span class="badge" style="position:static;margin-left:4px">${un.length}</span></h3>
        ${un.slice(0,4).map(n=>`<div class="list-item" style="cursor:pointer" data-nt="${n.id}">
          <div class="g"><b>${esc(n.title)}</b><small>${esc(n.from||'')} · ${fmtDate(n.time)} · ${esc(n.body)}</small></div>
          <span class="tag ${n.type==='stock'?'err':n.type==='out'?'warn':'ok'}">${n.type==='in'?'入库':n.type==='out'?'出库':n.type==='stock'?'缺货':'通知'}</span>
        </div>`).join('')}
        <button class="btn ghost block" style="margin-top:10px" id="dashNt">查看全部消息</button>
      </div>`;})()}
    <div class="card">
      <h3>近 7 天出入库</h3>
      <div class="bar-chart">
        ${days.map(d=>`<div class="col">
          <div class="in" style="height:${d.inQ/max*84}px" title="入库 ${qty(d.inQ)}（按各商品单位合计）"></div>
          <div class="out" style="height:${d.outQ/max*84}px" title="出库 ${qty(d.outQ)}（按各商品单位合计）"></div>
          <div class="lb">${d.lb}</div></div>`).join('')}
      </div>
      <div class="legend"><span><i class="dot" style="background:#8C1C13"></i>入库</span>
        <span><i class="dot" style="background:#D4A84B"></i>出库</span></div>
    </div>
    <div class="dual">
    <div class="card">
      <h3>库存预警 TOP</h3>
      ${alertList.length?alertList.slice(0,5).map(x=>`
        <div class="list-item">
          <div class="g"><b>${esc(x.p.name)}</b><small>${esc(x.p.cat||'')} · 安全库存 ${qu(x.p.safe,uOf(x.p))}</small></div>
          <div style="text-align:right"><span class="tag err">缺 ${qu(x.gap,uOf(x.p))}</span>
            <div style="font-size:11.5px;color:#7A6A5C;margin-top:2px">现存 ${qu(x.total,uOf(x.p))}</div></div>
        </div>`).join(''):'<div class="empty tight"><span class="big">✓</span>库存充足，暂无预警</div>'}
      <button class="btn ghost block" style="margin-top:10px" data-go="alerts">查看全部库存预警</button>
    </div>
    <div class="card">
      <h3>临期预警
        <span class="tag err" style="margin-left:6px">已过期 ${expBad.length}</span>
        <span class="tag warn" style="margin-left:4px">7 天内 ${exp7.length}</span>

        <span class="tag ${r.days<0?'err':r.days<=7?'warn':'gray'}">${r.days<0?'已过期 '+Math.abs(r.days)+' 天':r.days===0?'今天到期':'剩 '+r.days+' 天'}</span>

      <button class="btn ghost block" style="margin-top:10px" data-go-exp>查看全部保质期预警</button>
    </div>
    </div>`;
  const g=el.querySelector('[data-go]'); if(g) g.onclick=()=>go('alerts');
  const ge=el.querySelector('[data-go-exp]'); if(ge) ge.onclick=()=>{alertTab='exp';go('alerts');};
  const dn=el.querySelector('#dashNt'); if(dn) dn.onclick=()=>openNotices();
  el.querySelectorAll('[data-nt]').forEach(r=>r.onclick=()=>openNoticeDetail(r.dataset.nt));

    document.getElementById('fScan').onclick=()=>openScanner(code=>{
      const cur=document.getElementById('fBar').value.trim();
      document.getElementById('fBar').value=cur?(cur+','+code):code;
    });
    document.getElementById('fSave').onclick=()=>{
      const name=document.getElementById('fName').value.trim();
      if(!name){ toast('请填写商品名称','err'); return; }
      let cat=document.getElementById('fCat').value;
      if(cat==='__new'||!cat){ toast('请选择商品分类','err'); return; }
      const unit=document.getElementById('fUnit').value.trim();
      if(!unit){ toast('请填写单位','err'); return; }
      if(cat==='肉类'&&!MEAT_UNITS.includes(unit)){ toast('肉类单位只能是「斤」或「公斤」','err'); return; }
      const cost=Number(document.getElementById('fCost').value)||0;
      if(cost<=0&&!id){ toast('请填写进价','err'); return; }
      const bars=[...new Set(document.getElementById('fBar').value.split(',').map(s=>s.trim()).filter(Boolean))];
      if(!bars.length){ const auto=nextAutoCode(); bars.push(auto); toast('未填条码，已自动生成 '+auto); }
      const obj={
        id:p.id||uid('pd'),name,cat,spec:'',unit,
        barcodes:bars, code:p.code||bars[0].slice(-6),
        safe:Number(document.getElementById('fSafe').value)||0,cost,
        price:Number(document.getElementById('fPrice').value)||0,
        createdAt:p.createdAt||nowStr()
      };
      if(id){
        DB.products[DB.products.findIndex(x=>x.id===id)]=obj;
        log('修改商品',obj.name+' · '+obj.cat+' · 进价'+obj.cost);
      }else{
        DB.products.unshift(obj);
        const q=Number(document.getElementById('fInitQty').value)||0;
        const wsel=document.getElementById('fInitWh');
        const whId=wsel&&wsel.value;
        if(q>0&&whId){
          const k=stockKey(whId,obj.id);
          DB.stock[k]={qty:Math.round(q*1000)/1000,cost};
          addBatch(whId,obj.id,q,{no:'期初'});
          log('新增商品',obj.name+' 初始库存 '+q+obj.unit);
        }else{
          log('新增商品',obj.name+' · 进价'+obj.cost);
        }
      }
      save(); closeModal(); render(); updateBell(); toast('已保存');
    };
  });
}

/* 采购模板：日期 供应商 物品名称 数量 单位 金额 备注 */
const PUR_HEADERS=['日期','供应商','物品名称','数量','单位','金额','备注'];
function downloadPurchaseTemplate(){
  if(!hasXLSX()){ toast('Excel 组件加载中，请稍后或检查网络','err'); return; }
  const sample=[
    ['2026-11-20','东胜牛羊肉批发','羔羊卷',10,'盒',320,'冷鲜，次日到店'],
    ['2026-11-20','东胜牛羊肉批发','肥牛卷',8,'盒',228,''],
    ['2026-11-21','蔬菜批发市场','娃娃菜',30,'颗',84,'']
  ];
  const ws=XLSX.utils.aoa_to_sheet([PUR_HEADERS,...sample]);
  ws['!cols']=[{wch:14},{wch:22},{wch:18},{wch:10},{wch:8},{wch:12},{wch:24}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'采购明细');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
    ['填写说明'],
    ['1. 第一行表头不要改，从第二行开始一行填一笔采购。'],
    ['2. 「物品名称」必填；「日期」留空按导入当天算，支持 2026/11/20、2026年11月20日 等写法。'],
    ['3. 「数量」和「金额」只填数字，不要带单位或 ¥ 符号。'],
    ['4. 「单位」填 箱/斤/袋/盒 之类，用于显示。'],
    ['5. 「供应商」可留空，留空显示「-」。'],
    ['6. 采购记录只是记账台账，不会自动增加库存；要增加库存请用「入库」或「入库导入」。'],
    ['7. 示例 3 行导入前删掉。']
  ]),'填写说明');
  XLSX.writeFile(wb,'采购导入模板.xlsx');
}
function importPurchase(file){
  if(!hasXLSX()){ toast('Excel 组件加载中，请稍后重试','err'); return; }
  readSheetRows(file,rows=>importPurchaseRows(rows));
}
function importPurchaseRows(rows){
  if(!rows||!rows.length){ toast('表格是空的','err'); return; }
  let hi=-1,map={};
  for(let i=0;i<Math.min(5,rows.length);i++){
    const r=rows[i].map(normHeader);
    const idxAny=(...keys)=>{ for(const k of keys){ const x=r.findIndex(h=>h&&h.includes(k)); if(x>=0) return x; } return -1; };
    const ni=idxAny('物品','名称','品名');
    if(ni>=0){ hi=i; map={date:idxAny('日期','时间'),sup:idxAny('供应商','商家','客户'),
      name:ni,qty:idxAny('数量','件数'),unit:idxAny('单位'),amt:idxAny('金额','总额','合计'),note:idxAny('备注','说明')}; break; }
  }
  if(hi<0){ toast('没找到表头，请用「下载模板」的格式填写','err'); return; }
  let ok=0, bad=[];
  rows.slice(hi+1).forEach((r,i)=>{
    const g=k=>map[k]>=0&&map[k]!=null?String(r[map[k]]||'').trim():'';
    const name=g('name');
    if(!name){ if(r.some(v=>String(v).trim())) bad.push('第 '+(hi+2+i)+' 行没有物品名称'); return; }
    const num=s=>Number(String(s).replace(/[¥￥,\s]/g,''))||0;
    DB.purchases.push(purchaseRec({
      date:normDate(g('date'))||today(), supplier:g('sup'), name,
      qty:num(g('qty')), unit:g('unit'), amount:num(g('amt')), note:g('note')
    }));
    ok++;
  });
  if(ok){
    log('导入采购',ok+' 条');
    save(); render();
    toast('导入完成：新增 '+ok+' 条采购记录'+(bad.length?'，跳过 '+bad.length+' 行：'+bad[0]:''));
  }else toast('没有可导入的行'+(bad.length?'：'+bad[0]:''),'err');
}
function exportPurchase(rows){
  const head=['日期','供应商','物品名称','数量','单位','金额','单价','经办','备注'];
  const body=rows.map(r=>[r.date||'',r.supplier||'',r.name,Number(r.qty)||0,r.unit||'',
    Number(r.amount)||0, r.qty?(Math.round((Number(r.amount)||0)/Number(r.qty)*100)/100):0,
    r.user||'',r.note||'']);
  const total=rows.reduce((a,r)=>a+(Number(r.amount)||0),0);
  body.push(['合计','','','','',Math.round(total*100)/100,'','','']);
  writeSheet([head,...body],'采购明细','采购明细_'+curStoreName()+'_'+today().replace(/-/g,'')+'.xlsx');
}

/* 默认权限人：本店库管优先 → 店长 → 管理员，且不选自己 */
function defaultApprover(storeId){
  const list=approversOf(storeId);
  const me=CUR.id;
  const pref=list.find(u=>u.id!==me&&u.role.includes('库管'))
    ||list.find(u=>u.id!==me&&u.role.includes('店长'))
    ||list.find(u=>u.id!==me)
    ||list[0];
  return pref;
}
/* 商品入库/出库后检查安全库存，低了给库管发提醒 */
function checkLowStock(whId,pid,docNo){
  const p=prod(pid); if(!p||!p.safe) return;
  const storeId=wh(whId)?.storeId||currentStoreId;
  const total=qtyInStore(storeId,pid);
  if(total<p.safe){
    const busy=(DB.notices||[]).some(n=>n.type==='stock'&&n.refId===pid&&(Date.now()-n.ts)<12*3600*1000);
    if(busy) return;                                   // 同一个商品 12 小时内只提醒一次
    pushNotice({type:'stock',storeId,refId:pid,
      title:'库存不足：'+p.name,
      body:`现存 ${qu(total,uOf(p))}，低于安全库存 ${qu(p.safe,uOf(p))}，请及时补货（${docNo}）`,
      to:staffOfStore(storeId,'inbound').map(u=>u.id)});
  }
}

        ${ws.map(w=>`<option value="${w.id}" ${w.id===defWh.id?'selected':''}>${esc(whLabel(w))}</option>`).join('')}</select>

        <div style="font-size:11.5px;color:#A99C8F;margin-top:4px">按登录账号自动记录，不可改</div></div>

    <div class="field"><label>添加商品</label>
      <div style="display:flex;gap:8px">

          items:items.map(i=>({pid:i.pid,qty:i.qty,unit:prod(i.pid)?.unit||''})),void:false};

        pushNotice({type:'out',storeId:whStore,refId:doc.id,

      save(); closeModal(); render(); updateBell(); toast('提交成功，已通知相关人员');
    };
  });
}

/* 删除整张单据（仅管理员）：库存回滚后把单据从记录里移除 */
function deleteStockDoc(kind,id){
  if(!isAdminUser()){ toast('只有管理员可以删除单据','err'); return; }
  const arr=kind==='in'?DB.stockIn:DB.stockOut;
  const d=arr.find(x=>x.id===id); if(!d) return;
  if(!confirm('删除后单据记录会被移除、库存自动回滚，且不可恢复。确定删除 '+d.no+'？')) return;
  if(!d.void){
    if(kind==='in'){
      d.items.forEach(i=>setQty(d.whId,i.pid,-i.qty));
      DB.batches=(DB.batches||[]).filter(b=>!(b.no===d.no&&b.whId===d.whId));
    }else{
      d.items.forEach(i=>setQty(d.whId,i.pid,i.qty));
    }
  }
  if(kind==='in') DB.stockIn=DB.stockIn.filter(x=>x.id!==id);
  else DB.stockOut=DB.stockOut.filter(x=>x.id!==id);
  log('删除'+(kind==='in'?'入库单':'出库单'), d.no+' '+(d.void?'（原已作废）':''));
  save(); closeModal(); render(); toast('已删除 '+d.no);
}

/* ---------- 库存查询 ---------- */
let stockFilter={kw:'',wh:'',cat:''};
function viewStock(el){
  const ws=whsOf(currentStoreId);
  const rows=[];
  DB.products.forEach(p=>{
    ws.forEach(w=>{
      const q=qtyOf(w.id,p.id);
      if(stockFilter.wh&&w.id!==stockFilter.wh) return;
      if(stockFilter.cat&&p.cat!==stockFilter.cat) return;
      const kw=stockFilter.kw.trim();
      if(kw&&!(p.name.includes(kw)||p.barcodes.some(b=>b.includes(kw))||p.code.includes(kw))) return;
      if(q<=0&&stockFilter.wh!==''&&!kw) return;
      rows.push({p,w,q,cost:DB.stock[stockKey(w.id,p.id)]?.cost??p.cost});
    });
  });
  const cats=[...new Set(DB.products.map(p=>p.cat))];
  el.innerHTML=`
    <div class="page-head"><h2>库存查询</h2><span class="sp"></span>
      <button class="btn ghost sm" id="stExport">导出 Excel</button></div>
    <div class="toolbar">
      <input class="input" id="sKw" placeholder="名称 / 条码 / 编码" value="${esc(stockFilter.kw)}">
      <button class="btn ghost sm" id="sScan">📷 扫码</button>
      <select class="inp" id="sWh"><option value="">全部仓库</option>
        ${ws.map(w=>`<option value="${w.id}" ${stockFilter.wh===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select>
      <select class="inp" id="sCat"><option value="">全部分类</option>

    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>商品</th><th>仓库</th><th class="num">库存</th><th class="num">进价</th><th class="num">金额</th><th>状态</th><th>效期</th><th></th></tr></thead>
      <tbody>${rows.length?rows.map(r=>{const bs=batchesOf(r.w.id,r.p.id);const ef=bs.filter(b=>b.exp).sort((a,b)=>a.exp<b.exp?-1:1)[0];
        const dl=ef?daysLeft(ef.exp):null;
        return `<tr>
        <td><b>${esc(r.p.name)}</b><div style="font-size:11px;color:#7A6A5C">${esc(r.p.cat||'')}</div></td>

        <td>${r.q<r.p.safe?'<span class="tag warn">偏低</span>':'<span class="tag ok">正常</span>'}</td>
        <td>${ef?(dl<0?`<span class="tag err">过期${Math.abs(dl)}天</span>`:dl<=7?`<span class="tag warn">${esc(ef.exp)}</span>`:`<span style="font-size:11.5px;color:#7A6A5C">${esc(ef.exp)}</span>`) + (bs.length>1?`<div style="font-size:10.5px;color:#A99C8F">${bs.length} 个批次</div>`:''):'<span style="color:#CFC4B6">—</span>'}</td>
        <td><button class="btn ghost sm" data-flow="${r.p.id}|${r.w.id}">流水</button></td></tr>`;}).join('')
      :`<tr><td colspan="8"><div class="empty"><span class="big">☰</span>没有匹配的库存记录</div></td></tr>`}</tbody>

  el.querySelector('#stExport').onclick=()=>exportStock(rows);
  el.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{
    const [pid,whId]=b.dataset.flow.split('|'); flowOf(pid,whId);
  });
}
function flowOf(pid,whId){
  const p=prod(pid), w=wh(whId);
  const list=[];
  DB.stockIn.filter(d=>!d.void&&d.whId===whId).forEach(d=>{
    d.items.filter(i=>i.pid===pid).forEach(i=>{
      list.push({time:d.date,type:'入库',no:d.no,q:i.qty,user:d.user,note:d.note||''});
    });
  });
  DB.stockOut.filter(d=>!d.void&&d.whId===whId).forEach(d=>{
    d.items.filter(i=>i.pid===pid).forEach(i=>{
      list.push({time:d.date,type:'出库',no:d.no,q:-i.qty,user:d.user,note:d.dept||''});
    });
  });
  DB.stocktakes.filter(d=>!d.void&&d.whId===whId).forEach(d=>{

function startStocktake(ws){
  if(!ws.length){ toast('请先新增仓库','err'); return; }
  modal('开始盘点',`
    <div class="field"><label>盘点仓库 *</label><select class="inp" id="tkWh" style="width:100%">
      ${ws.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input class="input" id="tkScanKw" placeholder="扫码定位商品" autocomplete="off">
      <button class="btn ghost" id="tkScan">📷</button>
    </div>
    <div id="tkList"></div>
    <div class="modal-foot"><button class="btn" id="tkSave">提交盘点</button></div>`,()=>{
    const state={};
    const draw=()=>{
      const whId=document.getElementById('tkWh').value;
      const box=document.getElementById('tkList');
      const kw=document.getElementById('tkScanKw').value.trim();
      const list=DB.products.filter(p=>{
        if(!kw) return qtyOf(whId,p.id)>0||DB.stock[stockKey(whId,p.id)];
        return qtyOf(whId,p.id)>0?findHit(p,kw):findHit(p,kw);
      });
      box.innerHTML=list.length?list.map(p=>{
        const book=qtyOf(whId,p.id);
        const real=state[p.id]!==undefined?state[p.id]:book;
        const diff=Math.round((real-book)*1000)/1000;
        return `<div class="list-item">
          <div class="g"><b>${esc(p.name)}</b><small>账面 ${qu(book,uOf(p))}
            ${diff?'<span class="tag '+(diff>0?'ok':'err')+'">'+(diff>0?'盘盈 ':'盘亏 ')+qu(Math.abs(diff),uOf(p))+'</span>':''}</small></div>
          <input class="inp" style="width:96px" type="number" step="0.01" value="${real}" data-real="${p.id}"></div>`;
      }).join(''):'<div class="empty" style="padding:18px">该仓库暂无商品</div>';
      box.querySelectorAll('[data-real]').forEach(inp=>inp.oninput=e=>{
        state[e.target.dataset.real]=Number(e.target.value)||0; draw();
      });
    };
    function findHit(p,kw){ return p.name.includes(kw)||p.barcodes.some(b=>b.includes(kw))||p.code.includes(kw); }
    document.getElementById('tkWh').onchange=()=>{Object.keys(state).forEach(k=>delete state[k]); draw();};
    document.getElementById('tkScanKw').oninput=draw;
    document.getElementById('tkScan').onclick=()=>openScanner(code=>{
      document.getElementById('tkScanKw').value=code; draw();
    });
    document.getElementById('tkWh').onchange();
    draw();
    document.getElementById('tkSave').onclick=()=>{
      const whId=document.getElementById('tkWh').value;
      const items=Object.keys(state).map(pid=>({pid,book:qtyOf(whId,pid),real:state[pid],diff:Math.round((state[pid]-qtyOf(whId,pid))*1000)/1000}))
        .filter(i=>i.diff!==0);
      if(!items.length){ toast('没有差异，无需调整','err'); return; }
      const doc={id:uid('st'),no:nextNo('st'),storeId:currentStoreId,whId,date:nowStr(),user:CUR.name,items,void:false};
      items.forEach(i=>setQty(whId,i.pid,i.diff));
      DB.stocktakes.unshift(doc); log('盘点',doc.no+' 盘盈'+items.filter(i=>i.diff>0).length+'项 盘亏'+items.filter(i=>i.diff<0).length+'项');
      save(); closeModal(); render(); toast('盘点已提交，库存已调整');
    };
  });
}

/* ---------- 预警（库存不足 / 临期过期） ---------- */
let alertTab='low';
function viewAlerts(el){
  const list=DB.products.map(p=>({p,total:qtyInStore(currentStoreId,p.id),gap:Math.round((p.safe-qtyInStore(currentStoreId,p.id))*100)/100}))
    .filter(x=>x.total<x.p.safe).sort((a,b)=>b.gap-a.gap);
  const exp=expiringRows(currentStoreId);
  const cExp=exp.filter(r=>r.days<0).length;

  const tabs=`<div class="toolbar" style="gap:8px;margin-bottom:10px">
    <button class="btn ${alertTab==='low'?'':'ghost'} sm" id="atLow">库存不足 ${list.length?`<span style="opacity:.7">${list.length}</span>`:''}</button>
    <button class="btn ${alertTab==='exp'?'':'ghost'} sm" id="atExp">保质期 ${exp.length?`<span style="opacity:.7">${exp.length}</span>`:''}</button>
  </div>`;
  el.innerHTML=`
    <div class="page-head"><h2>预警</h2><span class="sp"></span>
      <button class="btn ghost sm" id="aExport">导出 Excel</button>
      ${alertTab==='low'?'<button class="btn sm" id="aIn">一键加入库单</button>':''}</div>
    ${tabs}
    ${alertTab==='low'?`
    <div class="tbl-wrap"><table>
      <thead><tr><th>商品</th><th>分类</th><th class="num">当前库存</th><th class="num">安全库存</th><th class="num">缺口</th><th>建议</th></tr></thead>
      <tbody>${list.length?list.map(x=>`<tr>
        <td><b>${esc(x.p.name)}</b><div style="font-size:11px;color:#7A6A5C">${esc(x.p.cat||'')}</div></td>
        <td>${esc(x.p.cat)}</td><td class="num">${qu(x.total,uOf(x.p))}</td>
        <td class="num">${qu(x.p.safe,uOf(x.p))}</td><td class="num"><span class="tag err">${qu(x.gap,uOf(x.p))}</span></td>
        <td>${x.total===0?'<span class="tag err">已断货</span>':'<span class="tag warn">需补货</span>'}</td></tr>`).join('')
        :`<tr><td colspan="6"><div class="empty"><span class="big">✓</span>所有商品库存充足</div></td></tr>`}</tbody></table></div>`
    :expiryBlock(exp,cExp,c7,c30)}`;
  el.querySelector('#atLow').onclick=()=>{alertTab='low';render();};
  el.querySelector('#atExp').onclick=()=>{alertTab='exp';render();};
  if(alertTab==='low'){
    el.querySelector('#aExport').onclick=()=>exportAlerts(list);

    };
  }else{
    el.querySelector('#aExport').onclick=()=>exportExpiry(exp);
    const so=el.querySelector('#eOut');
    if(so) so.onclick=()=>toast('建议在「出库」里选领用部门『报废』把过期品扣掉，或盘点时直接盘亏');
  }
}
/* 取当前门店所有批次，算剩余天数 */
function expiringRows(storeId){
  const whIds=new Set(whsOf(storeId).map(w=>w.id));
  return (DB.batches||[]).filter(b=>whIds.has(b.whId)&&b.qty>0&&b.exp)
    .map(b=>{ const d=daysLeft(b.exp); return {b,p:prod(b.pid),wh:wh(b.whId),days:d==null?9999:d}; })
    .filter(r=>r.p&&r.days<=60)
    .sort((a,b)=>a.days-b.days);
}
function expiryBlock(rows,cExp,c7,c30){
  const bar=(r)=>{
    const total=r.b.qty0&&r.b.qty0>0?r.b.qty0:r.b.qty;
    const pct=Math.max(0,Math.min(100,Math.round((r.b.qty/(total||1))*100)));
    return `<div style="height:4px;background:#EFE7DA;border-radius:3px;overflow:hidden;margin-top:4px;width:88px">
      <div style="height:4px;width:${pct}%;background:${r.days<0?'#B02A1D':r.days<=7?'#B5651D':'#4B7A46'}"></div></div>`;
  };
  const tag=r=>{
    if(r.days<0) return `<span class="tag err">已过期 ${Math.abs(r.days)} 天</span>`;
    if(r.days===0) return '<span class="tag err">今天到期</span>';
    if(r.days<=7) return `<span class="tag warn">剩 ${r.days} 天</span>`;
    return `<span class="tag gray">剩 ${r.days} 天</span>`;
  };
  if(!rows.length){
    return `<div class="tbl-wrap"><table><tbody><tr><td><div class="empty"><span class="big">⏰</span>60 天内没有临期批次<br><span style="font-size:12px;color:#A99C8F">入库时填了到期日才会出现在这里</span></div></td></tr></tbody></table></div>`;
  }
  const group=(title,items,color)=>{
    if(!items.length) return '';
    return `<div class="card"><h3 style="color:${color}">${title}（${items.length}）</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>商品</th><th>仓库</th><th class="num">批次数量</th><th>到期日</th><th>状态</th></tr></thead>
        <tbody>${items.map(r=>`<tr>
          <td><b>${esc(r.p.name)}</b><div style="font-size:11px;color:#7A6A5C">${esc(r.b.no||'手工入库')}</div>${bar(r)}</td>
          <td>${esc(r.wh?.name||'-')}</td>
          <td class="num">${qu(r.b.qty,uOf(r.p))}</td>
          <td>${esc(r.b.exp)}</td>
          <td>${tag(r)}</td></tr>`).join('')}</tbody></table></div></div>`;
  };
  return `
    <div class="muted-strip" style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:10px">
      <span><b style="color:#B02A1D">${cExp}</b> 已过期</span>
      <span><b style="color:#B5651D">${c7}</b> 7 天内到期</span>
      <span><b style="color:#4B7A46">${c30}</b> 30 天内到期</span>
      <span style="color:#A99C8F">先到期的排在前面，出库自动先扣早批次（先进先出）</span>
    </div>
    ${group('已过期', rows.filter(r=>r.days<0), '#B02A1D')}
    ${group('7 天内到期', rows.filter(r=>r.days>=0&&r.days<=7), '#B5651D')}
    ${group('8～60 天到期', rows.filter(r=>r.days>7), '#4B7A46')}`;
}
function exportExpiry(rows){
  const head=['商品名称','仓库','批次数量','单位','到期日','剩余天数','状态','入库单号'];
  const body=rows.map(r=>[r.p.name,r.wh?.name||'',Number(r.b.qty),r.p.unit||'',r.b.exp,
    r.days<0?-Math.abs(r.days)+' 天(过期)':r.days+' 天',r.days<0?'已过期':r.days<=7?'临期':'正常',r.b.no||'']);
  writeSheet([head,...body],'保质期预警','保质期预警_'+curStoreName()+'_'+today().replace(/-/g,'')+'.xlsx');
}

function newTransfer(ws){
  if(ws.length<2){ toast('至少需要两个仓库才能调拨','err'); return; }
  const items=[];
  modal('新建调拨单',`
    <div class="form-row two">
      <div class="field"><label>调出仓库</label><select class="inp" id="trFrom" style="width:100%">
        ${ws.map(w=>`<option value="${w.id}">${esc(store(w.storeId).name)} / ${esc(w.name)}</option>`).join('')}</select></div>
      <div class="field"><label>调入仓库</label><select class="inp" id="trTo" style="width:100%">
        ${ws.map(w=>`<option value="${w.id}">${esc(store(w.storeId).name)} / ${esc(w.name)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>添加商品</label>
      <div style="display:flex;gap:8px"><input class="input" id="trSearch" placeholder="扫码枪 / 名称 / 条码">
        <button class="btn ghost" id="trScan" style="flex:0 0 auto">📷</button></div></div>
    <div id="trList"></div>
    <div class="modal-foot"><button class="btn" id="trSave">提交调拨</button></div>`,()=>{
    const draw=()=>{
      const box=document.getElementById('trList');
      box.innerHTML=items.length?items.map((it,i)=>`<div class="list-item">
        <div class="g"><b>${esc(prod(it.pid).name)}</b><small>调出仓现存 ${qu(qtyOf(document.getElementById('trFrom').value,it.pid),uOf(prod(it.pid)))}</small></div>
        <div class="qty-cell"><input class="inp" style="width:90px" type="number" step="0.01" value="${it.qty}" data-tq="${i}"><span>${esc(uOf(prod(it.pid)))}</span></div>
        <button class="btn ghost sm" data-tdel="${i}">✕</button></div>`).join(''):'<div class="empty" style="padding:16px">还没添加商品</div>';
      box.querySelectorAll('[data-tq]').forEach(inp=>inp.onchange=e=>{items[+e.target.dataset.tq].qty=Number(e.target.value)||0;});
      box.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.tdel,1); draw();});
    };
    const add=p=>{ if(items.find(i=>i.pid===p.id)) return; items.push({pid:p.id,qty:1}); draw(); document.getElementById('trSearch').value=''; };
    const s=document.getElementById('trSearch');
    s.onkeydown=e=>{
      if(e.key!=='Enter') return; e.preventDefault();
      const code=s.value.trim();
      const p=DB.products.find(x=>x.barcodes.includes(code)||x.code===code)||DB.products.find(x=>x.name.includes(code));
      if(p) add(p); else toast('未找到商品','err');
    };
    document.getElementById('trScan').onclick=()=>openScanner(code=>{ const p=findByCode(code); if(p) add(p); else toast('未找到','err'); });
    document.getElementById('trFrom').onchange=draw;
    document.getElementById('trSave').onclick=()=>{
      const from=document.getElementById('trFrom').value, to=document.getElementById('trTo').value;
      if(from===to){ toast('调出与调入仓库不能相同','err'); return; }
      if(!items.length){ toast('请添加商品','err'); return; }
      for(const i of items){ if(qtyOf(from,i.pid)<i.qty){ toast('「'+prod(i.pid).name+'」调出仓库存不足','err'); return; } }
      const doc={id:uid('tr'),no:nextNo('tr'),storeId:currentStoreId,fromWh:from,toWh:to,date:nowStr(),user:CUR.name,items:items.map(i=>({pid:i.pid,qty:i.qty}))};
      items.forEach(i=>{
        const fromCost=DB.stock[stockKey(from,i.pid)]?.cost??prod(i.pid).cost;
        setQty(from,i.pid,-i.qty,{toWh:to});
        const k=stockKey(to,i.pid);
        const before=DB.stock[k]?DB.stock[k].qty:0;
        const toCost=DB.stock[k]?.cost??prod(i.pid).cost;
        setQty(to,i.pid,i.qty,{silent:true});
        const r=DB.stock[k];
        r.cost=Math.round(((before*toCost+i.qty*fromCost)/(before+i.qty))*100)/100;
      });
      DB.transfers.unshift(doc); log('调拨',doc.no);
      save(); closeModal(); render(); toast('调拨完成');
    };
  });
}

/* ---------- 标签尺寸：35mm × 12mm（203dpi 热敏打印机 = 280×96 像素） ---------- */
const LBL_W_PX=280, LBL_H_PX=96, LBL_DPI=203;
/* EAN13 校验位 */
function ean13Check(d12){
  let sum=0;
  for(let i=0;i<12;i++) sum+=Number(d12[i])*(i%2?3:1);
  return (10-sum%10)%10;
}
/* 自动生成店内条码：69 + 10 位流水 + 校验位 = 13 位，EAN13 可直接扫 */
function nextAutoCode(){
  const used=new Set();
  DB.products.forEach(p=>(p.barcodes||[]).forEach(c=>used.add(String(c))));
  let max=0;
  used.forEach(c=>{ if(/^69\d{11}$/.test(c)) max=Math.max(max,Number(c.slice(2,12))); });
  let seq=max+1;
  for(let guard=0;guard<9999;guard++,seq++){
    const d12='69'+String(seq).padStart(10,'0');
    const full=d12+ean13Check(d12);
    if(!used.has(full)) return full;
  }
  return '69'+Date.now().toString().slice(-10);
}
/* 商品没有条码时补一个（并写回） */
function ensureBarcode(p){
  if(p.barcodes&&p.barcodes[0]) return p.barcodes[0];
  const code=nextAutoCode();
  p.barcodes=[code]; if(!p.code) p.code=code.slice(-6);
  return code;
}
function codeOf(p){ return ensureBarcode(p); }
/* 批量为缺条码的商品补齐，返回补齐数量 */
function ensureAllBarcodes(){
  let n=0;
  DB.products.forEach(p=>{ if(!(p.barcodes&&p.barcodes[0])){ ensureBarcode(p); n++; } });
  if(n) save();
  return n;
}
/* 数字条码优先用 EAN13（95 个模块，35mm 内条纹更粗更好扫），其余走 CODE128 */
function pickFormat(code){
  const s=String(code);
  if(/^\d{12,13}$/.test(s)){
    const p=document.createElement('canvas');
    try{ JsBarcode(p,s,{format:'EAN13',displayValue:false,margin:0,width:1,height:10}); return {format:'EAN13',modules:p.width}; }catch(e){}
  }
  const q=document.createElement('canvas');
  try{ JsBarcode(q,s,{format:'CODE128',displayValue:false,margin:0,width:1,height:10}); return {format:'CODE128',modules:q.width}; }
  catch(e){ return null; }
}
/* 按目标像素宽度自动算最粗的模块宽度，保证不糊又能塞进 35mm */
/* 35×12mm 光栅标签：顶部商品名 + 条码 + 数字；dpi 可调（默认 203dpi = 280×96） */
function labelCanvas(code,name,dpi,wmm,hmm){
  dpi=dpi||LBL_DPI;
  wmm=wmm||35; hmm=hmm||12;
  const mm=v=>Math.round(v/25.4*dpi);
  const W=mm(wmm), H=mm(hmm);
  const pick=pickFormat(code); if(!pick) return null;
  const modules=pick.modules||1;
  const padX=mm(Math.max(1.2,wmm*0.05));
  const nameH=mm(hmm*0.17);
  const fsName=Math.max(9,Math.round(nameH*0.8));
  const textH=mm(Math.max(2, hmm*0.13));
  const areaH=H-nameH-mm(0.6);
  const barH=Math.max(mm(4),areaH-textH);
  let scale=Math.floor((W-padX*2)/modules); const maxScale=Math.max(2,Math.round(mm(0.7)));
  if(scale>maxScale) scale=maxScale; if(scale<1) scale=1;
  const tmp=document.createElement('canvas');
  try{ JsBarcode(tmp,String(code),{format:pick.format,displayValue:true,
    fontSize:Math.max(9,Math.round(textH*0.95)),textMargin:Math.max(1,Math.round(mm(0.3))),margin:0,
    width:scale,height:barH}); }
  catch(e){ return null; }
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  // 商品名：居中、字号自适应、超长截断
  if(name){
    let fs=fsName;
    const pad=mm(2);
    do{ ctx.font='bold '+fs+'px "Microsoft YaHei","PingFang SC",sans-serif'; if(ctx.measureText(name).width<=W-pad*2) break; fs--; }while(fs>Math.max(6,Math.round(fsName*0.55)));
    const w=ctx.measureText(name).width;
    let txt=name;
    if(w>W-pad*2){ while(ctx.measureText(txt+'…').width>W-pad*2&&txt.length>1) txt=txt.slice(0,-1); txt+='…'; }
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#111';
    ctx.fillText(txt,W/2,nameH*0.5+mm(0.2));
  }
  const areaTop=nameH+mm(0.4);
  const MAXW=W-padX*2;
  if(tmp.width>MAXW){ // 超宽时等比缩小，保证两侧静区
    const k2=MAXW/tmp.width;
    ctx.drawImage(tmp, Math.round((W-MAXW)/2), areaTop+Math.max(0,Math.round((areaH-tmp.height*k2)/2)), MAXW, Math.round(tmp.height*k2));
  }else{
    ctx.drawImage(tmp, Math.max(0,Math.round((W-tmp.width)/2)), areaTop+Math.max(0,Math.round((areaH-tmp.height)/2)));
  }
  return cv;
}
/* 矢量版条码（预览/打印用，缩放不失真、条纹不会被压扁） */
/* 矢量条码（不含商品名，仅条码本体+下方数字） */
function barcodeSvg(code,opt){
  const pick=pickFormat(code); if(!pick) return null;
  const o=Object.assign({width:2,height:58,fontSize:15},opt||{});
  const NS='http://www.w3.org/2000/svg';
  const s=document.createElementNS(NS,'svg');
  try{ JsBarcode(s,String(code),{format:pick.format,displayValue:true,fontSize:o.fontSize,textMargin:1,margin:0,width:o.width,height:o.height,background:'#fff'}); }
  catch(e){ return null; }
  const w=parseFloat(s.getAttribute('width'))||0, h=parseFloat(s.getAttribute('height'))||0;
  if(!w||!h) return null;
  s.removeAttribute('width'); s.removeAttribute('height');
  s.setAttribute('viewBox','0 0 '+w+' '+h);
  s.setAttribute('preserveAspectRatio','xMidYMid meet');
  return {node:s,w,h};
}
function labelSvgEl(code){ const b=barcodeSvg(code); return b?b.node:null; }
function saveBlob(blob,name){
  const a=document.createElement('a'); const u=URL.createObjectURL(blob);
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);
}
/* 35×12mm 单张 PNG（203dpi，280×96，含商品名） */
function downloadLabelPng(id){
  const p=prod(id); if(!p) return;
  const code=codeOf(p);
  const cv=labelCanvas(code,p.name);
  if(!cv){ toast('该条码内容无法生成条码，请检查条码字符','err'); return; }
  cv.toBlob(b=>saveBlob(b,(p.name||'barcode')+'_'+code+'_35x12mm_203dpi.png'),'image/png');
}
/* 35×12mm 单张 SVG：矢量条码 + 商品名，尺寸写死 mm，放大打印也不糊 */
function labelSvgText(items){
  const NS='http://www.w3.org/2000/svg';
  const parts=items.map((it,i)=>{
    const bc=barcodeSvg(it.code,{width:2,height:44,fontSize:12});
    if(!bc) return '';
    const s=Math.min((LBL_W_PX-10)/bc.w,(LBL_H_PX-24)/bc.h);
    const dw=Math.round(bc.w*s), dh=Math.round(bc.h*s);
    const x=Math.round((LBL_W_PX-dw)/2), y=Math.round(21+(LBL_H_PX-22-dh)/2);
    const markup=new XMLSerializer().serializeToString(bc.node);
    const inner=markup.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
    const txt=escapeXml(it.name||'');
    return `<g transform="translate(0,${i*LBL_H_PX})">
      <rect x="0" y="0" width="${LBL_W_PX}" height="${LBL_H_PX}" fill="#fff"/>
      <text x="${LBL_W_PX/2}" y="13" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" font-weight="700" fill="#111" text-anchor="middle">${txt}</text>
      <svg x="${x}" y="${y}" width="${dw}" height="${dh}" viewBox="0 0 ${bc.w} ${bc.h}" preserveAspectRatio="xMidYMid meet">${inner}</svg>
    </g>`;
  }).join('');
  const h=LBL_H_PX*items.length;
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="35mm" height="${(12*items.length).toFixed(2)}mm" viewBox="0 0 ${LBL_W_PX} ${h}">${parts}</svg>`;
}
function escapeXml(s){ return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c])); }
function downloadLabelsSvg(single){
  if(single!=null){
    const p=prod(single); if(!p) return;
    const txt=labelSvgText([{code:codeOf(p),name:p.name}]);
    saveBlob(new Blob([txt],{type:'image/svg+xml'}),'条码35x12mm_'+codeOf(p).slice(0,12)+'.svg');
    return;
  }
  downloadSheetSvg();
}
/* 批量 PNG：改为 A4 整版（300dpi），标签之间留白互不干扰扫码 */
function downloadLabelsPng(){
  downloadSheetPng();
}
/* ---------- A4 横向整版：3 列 × 5 行 = 15 张/页，标签 89×31mm，间距 6mm（不干扰扫码） ---------- */
const A4_W=297, A4_H=210, LB_W=89, LB_H=31;
const SH_MX=8, SH_MY=8, SH_GX=6, SH_GY=6;
function sheetGrid(){
  const cols=Math.max(1,Math.floor((A4_W-SH_MX*2+SH_GX)/(LB_W+SH_GX)));
  const rows=Math.max(1,Math.floor((A4_H-SH_MY*2+SH_GY)/(LB_H+SH_GY)));
  return {cols,rows,per:cols*rows};
}
function cutName(name,max){
  const s=String(name||'');
  return s.length>max?s.slice(0,max-1)+'…':s;
}
function labelCellSvg(it,x,y){
  const bc=barcodeSvg(it.code,{width:2,height:60,fontSize:12});
  if(!bc) return '';
  const innerW=LB_W-4;                                   // 两侧各留 2mm 静区
  const nameH=LB_H*0.17, nmSize=nameH*0.78;
  const innerH=LB_H-nameH-1;
  const s=Math.min(innerW/bc.w, innerH/bc.h);
  const dw=bc.w*s, dh=bc.h*s;
  const bx=x+(LB_W-dw)/2, by=y+nameH+0.4+(innerH-dh)/2;
  const inner=new XMLSerializer().serializeToString(bc.node).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
  return `<g><rect x="${x}" y="${y}" width="${LB_W}" height="${LB_H}" fill="#fff"/>
    <text x="${(x+LB_W/2).toFixed(2)}" y="${(y+nameH*0.82).toFixed(2)}" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="${nmSize.toFixed(2)}" font-weight="700" fill="#111" text-anchor="middle">${escapeXml(cutName(it.name,Math.floor(innerW/(nmSize*1.02))))}</text>
    <svg x="${bx.toFixed(2)}" y="${by.toFixed(2)}" width="${dw.toFixed(2)}" height="${dh.toFixed(2)}" viewBox="0 0 ${bc.w} ${bc.h}" preserveAspectRatio="xMidYMid meet">${inner}</svg></g>`;
}
function sheetSvgPages(items){
  const {cols,rows,per}=sheetGrid();
  const pages=Math.max(1,Math.ceil(items.length/per));
  const out=[];
  for(let p=0;p<pages;p++){
    const cells=items.slice(p*per,(p+1)*per).map((it,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      return labelCellSvg(it, SH_MX+col*(LB_W+SH_GX), SH_MY+row*(LB_H+SH_GY));
    }).join('');
    out.push(`<svg class="a4sheet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${A4_W}mm" height="${A4_H}mm" viewBox="0 0 ${A4_W} ${A4_H}"><rect width="${A4_W}" height="${A4_H}" fill="#fff"/>${cells}</svg>`);
  }
  return out;
}
function sheetPngPages(items,dpi){
  dpi=dpi||300;
  const {cols,rows,per}=sheetGrid();
  const mm=v=>Math.round(v/25.4*dpi);
  const pages=Math.max(1,Math.ceil(items.length/per));
  const out=[];
  for(let p=0;p<pages;p++){
    const cv=document.createElement('canvas'); cv.width=mm(A4_W); cv.height=mm(A4_H);
    const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    items.slice(p*per,(p+1)*per).forEach((it,i)=>{
      const lab=labelCanvas(it.code,it.name,dpi,LB_W,LB_H); if(!lab) return;
      const col=i%cols, row=Math.floor(i/cols);
      ctx.drawImage(lab, mm(SH_MX+col*(LB_W+SH_GX)), mm(SH_MY+row*(LB_H+SH_GY)));
    });
    out.push(cv);
  }
  return out;
}
function selectedLabelItems(){
  if(!barSel.size){ toast('请先勾选商品','err'); return null; }
  const arr=[...barSel].map(id=>prod(id)).filter(Boolean).map(p=>({code:codeOf(p),name:p.name}));
  if(!arr.length){ toast('没有可导出的商品','err'); return null; }
  return arr;
}
function downloadSheetSvg(){
  const items=selectedLabelItems(); if(!items) return;
  const pages=sheetSvgPages(items);
  pages.forEach((s,i)=>saveBlob(new Blob([s],{type:'image/svg+xml'}),'条码A4_'+today().replace(/-/g,'')+(pages.length>1?'_P'+(i+1):'')+'.svg'));
  toast('已导出 A4 矢量标签 '+items.length+' 张（'+(items.length>sheetGrid().per?'共 '+pages.length+' 页':'1 页')+'）');
}
function downloadSheetPng(){
  const items=selectedLabelItems(); if(!items) return;
  const pages=sheetPngPages(items,300);
  pages.forEach((cv,i)=>cv.toBlob(b=>saveBlob(b,'条码A4_'+today().replace(/-/g,'')+(pages.length>1?'_P'+(i+1):'')+'.png'),'image/png'));
  toast('已导出 A4 标签 '+items.length+' 张（300dpi）');
}
/* 按分类直接导出整版（不依赖勾选） */
function downloadA4(items,label){
  const pages=sheetPngPages(items,300);
  const tag=(label||'分类');
  pages.forEach((cv,i)=>cv.toBlob(b=>saveBlob(b,'条码A4_'+tag+'_'+today().replace(/-/g,'')+(pages.length>1?'_P'+(i+1):'')+'.png'),'image/png'));
  toast('已导出「'+tag+'」'+items.length+' 张，共 '+pages.length+' 页 A4（300dpi）');
}
function downloadOne(id){ downloadLabelPng(id); }
function doPrint(){
  const items=selectedLabelItems(); if(!items) return;
  const pages=sheetSvgPages(items);
  document.getElementById('printArea').innerHTML=pages.join('');
  window.print();
}
function downloadSheet(){ downloadSheetPng(); }

function normHeader(s){ return String(s||'').replace(/\s|（.*?）|\(.*?\)/g,'').trim(); }
function importDishes(file){
  if(!hasXLSX()){ toast('Excel 组件未加载（需联网），请稍后重试','err'); return; }
  const fr=new FileReader();
  fr.onload=()=>{
    let rows;
    try{
      const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
    }catch(e){ toast('文件读不出来，请用下载的模板另存为 .xlsx 再试','err'); return; }
    if(!rows||!rows.length){ toast('表格是空的','err'); return; }
    // 找表头行（前 5 行里第一个能对上「名称」的行）
    let hi=-1, map={};
    for(let i=0;i<Math.min(5,rows.length);i++){
      const r=rows[i].map(normHeader);
      const idxAny=(...keys)=>{ for(const k of keys){ const x=r.findIndex(h=>h&&h.includes(k)); if(x>=0) return x; } return -1; };
      if(idxAny('名称')>=0){ hi=i; map={
        name:idxAny('名称','菜品','商品'),
        cat:idxAny('分类','类别'),
        unit:idxAny('单位'),
        bar:idxAny('条码','条形码','编码'),
        cost:idxAny('成本','进价'),
        price:idxAny('售价','价格','单价','金额'),
        safe:idxAny('安全库存','安全','预警')}; break; }
    }
    if(hi<0){ toast('没找到表头，请用「下载模板」的格式填写','err'); return; }
    let added=0, updated=0, skipped=0, autoGen=0;
    rows.slice(hi+1).forEach(r=>{
      const g=k=>map[k]>=0&&map[k]!=null?String(r[map[k]]||'').trim():'';
      const name=g('name');
      if(!name){ skipped++; return; }
      const bar=g('bar').replace(/\s/g,'');
      const cat=g('cat')||'其他';
      let unit=g('unit')||(cat==='肉类'?'斤':'包');
      if(cat==='肉类'&&!MEAT_UNITS.includes(unit)) unit='斤';      // 肉类统一按斤/公斤
      const cost=Number(String(g('cost')).replace(/[¥￥,\s]/g,''))||0;
      const price=Number(String(g('price')).replace(/[¥￥,\s]/g,''))||0;
      const safe=Number(String(g('safe')).replace(/[^0-9.]/g,''))||0;
      let target=null;
      if(bar) target=DB.products.find(p=>p.barcodes.includes(bar));
      if(!target) target=DB.products.find(p=>p.name===name);
      if(target){
        target.cat=cat||target.cat; target.unit=unit||target.unit;
        if(cost) target.cost=cost; if(price) target.price=price; if(safe) target.safe=safe;
        if(bar&&!target.barcodes.includes(bar)) target.barcodes.push(bar);
        if(!(target.barcodes&&target.barcodes[0])){ ensureBarcode(target); autoGen++; }
        updated++;
      }else{
        const np={id:uid('pd'),name,cat,spec:'',unit,
          barcodes:bar?[bar]:[], code:bar?bar.slice(-6):'', safe,cost,price,createdAt:nowStr()};
        if(!bar){ const auto=ensureBarcode(np); np.code=auto.slice(-6); autoGen++; }
        DB.products.unshift(np);
        added++;
      }
    });
    if(added||updated){
      log('导入商品',`新增 ${added} 个，更新 ${updated} 个`);
      save(); render();
      toast(`导入完成：新增 ${added} 个，更新 ${updated} 个${autoGen?`，自动生成条码 ${autoGen} 个`:''}${skipped?`，跳过空行 ${skipped}`:''}`);
    }else toast('没有可导入的数据，检查一下「商品名称」列','err');
  };
  fr.onerror=()=>toast('文件读取失败','err');
  fr.readAsArrayBuffer(file);
}

function importDoc(kind,file){

  readSheetRows(file,rows=>importDocRows(kind,rows));
}
function importDocRows(kind,rows){
    if(!rows||!rows.length){ toast('表格是空的','err'); return; }
    let hi=-1,map={};
    for(let i=0;i<Math.min(5,rows.length);i++){
      const r=rows[i].map(normHeader);
      const idxAny=(...keys)=>{ for(const k of keys){ const x=r.findIndex(h=>h&&h.includes(k)); if(x>=0) return x; } return -1; };
      if(idxAny('名称','条码','条形码')>=0){ hi=i; map={
        name:idxAny('名称','商品','菜品'), bar:idxAny('条码','条形码','编码'),
        qty:idxAny('数量','件数'), cost:idxAny('进价','成本','单价'),
        dept:idxAny('部门','领用'), exp:idxAny('到期'), prod:idxAny('生产'),
        days:idxAny('保质期')}; break; }
    }
    if(hi<0){ toast('没找到表头，请用「下载模板」的格式填写','err'); return; }
    const items=[]; const bad=[];
    rows.slice(hi+1).forEach((r,n)=>{
      const g=k=>map[k]!=null&&map[k]>=0?String(r[map[k]]||'').trim():'';
      const name=g('name'), bar=g('bar').replace(/\s/g,'');
      if(!name&&!bar) return;
      const q=Number(String(g('qty')).replace(/[^\d.]/g,''))||0;
      if(!q){ bad.push(`第 ${hi+n+2} 行：数量为空或 0`); return; }
      const p=(bar&&DB.products.find(x=>x.barcodes.includes(bar)))
        ||DB.products.find(x=>x.name===name)
        ||DB.products.filter(x=>name&&x.name.includes(name))[0];
      if(!p){ bad.push(`第 ${hi+n+2} 行：找不到商品「${name||bar}」`); return; }
      const cost=Number(String(g('cost')).replace(/[¥￥,\s]/g,''));
      const dept=g('dept');
      let exp=normDate(g('exp'));
      if(!exp){
        const pd=normDate(g('prod')), ds=Number(String(g('days')).replace(/[^\d.]/g,''));
        if(pd&&ds) exp=addDays(pd,ds);
      }
      const same=items.find(i=>i.pid===p.id&&(!dept||i.dept===dept)&&(!exp||i.exp===exp));
      if(same){ same.qty+=q; if(cost) same.cost=cost; }
      else items.push({pid:p.id,qty:q,cost:cost||Number(p.cost)||0,dept:dept||'后厨',exp});
    });
