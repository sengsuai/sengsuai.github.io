/* =========================================================================
   扫码组件（含设备预检、硬超时、失败卡片、常驻手动输入）
   ========================================================================= */
const SC={
  stream:null, raf:null, timer:null, zx:null, nativeDetector:null,
  running:false, onScan:null, frames:0, openedAt:0, vw:0, vh:0, video:null,
  attempts:0, lastErr:''
};
function openScanner(onScan, title){
  SC.onScan=onScan;
  const box=document.getElementById('scanner');
  box.classList.add('on');
  document.getElementById('scanTitle').textContent=title||'扫码录入条码';
  document.getElementById('scanInput').value='';
  document.getElementById('gunBadge').classList.toggle('hide', !isDesktop());
  document.getElementById('scanFail').classList.add('hide');
  document.getElementById('scanBusy').classList.add('hide');
  document.getElementById('scanFrame').classList.add('hide');
  document.getElementById('scanTipMain').textContent=isDesktop()
    ? '电脑端可插扫码枪直接扫，或手动输入条码'
    : '将条码对准框内，识别成功自动录入';
  document.getElementById('scanVideo').style.opacity='0';
  updateDebug('idle');
  startCamera();
  // 照片识别：用系统相机拍一张清晰照片，再导入识别（比实时视频稳）
  const photoBtn=document.getElementById('scanPhoto');
  const fileInput=document.getElementById('scanFile');
  if(photoBtn&&fileInput){
    photoBtn.onclick=()=>fileInput.click();
    fileInput.onchange=e=>{
      const f=e.target.files&&e.target.files[0];
      if(f) decodeImageFile(f);
      fileInput.value='';
    };
  }
  setTimeout(()=>document.getElementById('scanInput').focus(),50);
}
function isDesktop(){ return !/Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent); }
function updateDebug(state,errName,errMsg){
  const el=document.getElementById('scanDebug');
  el.innerHTML=[
    '状态 '+state,
    '| https '+(window.isSecureContext?'是':'否'),
    '| mediaDevices '+(navigator.mediaDevices?'有':'无'),
    '| 画面 '+SC.frames+' 帧',
    '| '+SC.vw+'×'+SC.vh,
    '| ready '+(SC.video?SC.video.readyState:'-'),
    errName?('| <span style="color:#B02A1D">'+esc(errName)+'</span>'):'',
    errMsg?('| '+esc(errMsg)):'',
    SC.attempts?('| 解码 '+(SC.attempts)+' 次'):'',
    SC.lastErr?('| <span style="color:#B5651D">'+esc(String(SC.lastErr).slice(0,40))+'</span>'):'',
    '| '+(isDesktop()?'桌面端':'移动端')
  ].join(' ');
}
function closeScanner(){
  stopCamera();
  document.getElementById('scanner').classList.remove('on');
  SC.onScan=null;
}
function stopCamera(){
  SC.running=false;
  if(SC.raf){ cancelAnimationFrame(SC.raf); SC.raf=null; }
  if(SC.timer){ clearInterval(SC.timer); SC.timer=null; }
  if(SC.stream){ SC.stream.getTracks().forEach(t=>{try{t.stop()}catch(e){}}); SC.stream=null; }
  const v=document.getElementById('scanVideo');
  if(v){ try{v.pause()}catch(e){} v.srcObject=null; }
  SC.frames=0;
}
function showFail(title,msg,code,canSwitch){
  document.getElementById('failTitle').textContent=title;
  document.getElementById('failMsg').textContent=msg;
  document.getElementById('failCode').textContent=code||'';
  document.getElementById('scanFail').classList.remove('hide');
  document.getElementById('scanBusy').classList.add('hide');
  document.getElementById('scanFrame').classList.add('hide');
  document.getElementById('scanVideo').style.opacity='0';
  document.getElementById('failSwitch').classList.toggle('hide',!canSwitch);
}
async function startCamera(){
  const v=document.getElementById('scanVideo');
  SC.video=v;
  document.getElementById('scanFail').classList.add('hide');
  document.getElementById('scanFrame').classList.add('hide');
  v.style.opacity='0';
  updateDebug('precheck');

  // 1. 环境预检
  if(!window.isSecureContext){
    showFail('无法使用摄像头','当前不是 HTTPS/安全环境，浏览器禁止调用摄像头。请用 https 地址打开，或直接手动输入条码。','NotSecureContext');
    return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showFail('当前环境不支持扫码', isWeChat()
      ? '微信内置浏览器不支持网页调用摄像头，请点右上角「…」→ 在浏览器打开。'
      : '当前浏览器不支持摄像头调用，请换 Chrome / Safari / Edge 打开。','NotSupported');
    return;
  }

  let devices=[];
  try{
    const all=await navigator.mediaDevices.enumerateDevices();
    devices=all.filter(d=>d.kind==='videoinput');
  }catch(e){ devices=[]; }

  if(devices.length===0){
    updateDebug('no-device','NoVideoInput');
    showFail('当前设备未检测到可用摄像头',
      isDesktop()
        ? '这台电脑没有可用的摄像头。建议直接用扫码枪扫（插上即扫，自动录入），或在下方输入框手动输入条码。'
        : '没有检测到摄像头设备，请检查系统相机权限，或手动输入条码。',
      'NoVideoInput');
    return;
  }

  // 2. 取流（12s 硬超时）
  document.getElementById('scanBusy').classList.remove('hide');
  document.getElementById('scanBusyText').textContent='正在启动摄像头…';
  updateDebug('requesting');

  let stream=null, gErr=null;
  // 分辨率阶梯：条码识别吃分辨率，先要高清，拿不到再降级（之前只要 1280×720，细条码根本不够像素）
  const ladders=[
    {facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
    {width:{ideal:2560},height:{ideal:1440}},
    {facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
    {width:{ideal:1280},height:{ideal:720}}
  ];
  for(const vc of ladders){
    try{
      stream=await withTimeout(navigator.mediaDevices.getUserMedia({audio:false,video:vc}),12000,'摄像头响应超时（12s）');
      gErr=null; break;
    }catch(err){ gErr=err; stream=null; }
  }
  if(!stream){
    try{
      stream=await withTimeout(navigator.mediaDevices.getUserMedia({audio:false,video:true}),10000,'摄像头响应超时（降级）');
      gErr=null;
    }catch(e2){ gErr=e2; }
  }
  if(!stream){
    const name=(gErr&&gErr.name)||'UnknownError';
    const map={
      NotAllowedError:'摄像头权限被拒绝，请在浏览器地址栏的权限设置里允许摄像头后重试。',
      NotFoundError:'没有检测到摄像头设备。',
      NotReadableError:'摄像头被其它程序占用（如微信视频、相机），请关闭后重试。',
      OverconstrainedError:'摄像头不支持所需分辨率。',
      TimeoutError:'等待摄像头响应超时。'
    };
    stopCamera();
    updateDebug('error',name,gErr&&gErr.message);
    showFail('摄像头启动失败',map[name]||('启动失败：'+(gErr&&gErr.message||name)),name+' / '+(gErr&&gErr.message||''));
    return;
  }

  SC.stream=stream;
  SC.running=true;
  v.srcObject=stream;
  v.muted=true;
  try{ await v.play(); }catch(e){}

  // 3. 等出帧（8s，连续 3 帧）
  const ok=await new Promise(resolve=>{
    const t0=Date.now(); let hits=0;
    SC.timer=setInterval(()=>{
      if(!SC.running){ clearInterval(SC.timer); SC.timer=null; resolve(false); return; }
      if(v.videoWidth>0&&v.readyState>=2){
        hits++; SC.frames=hits; SC.vw=v.videoWidth; SC.vh=v.videoHeight;
        updateDebug('streaming');
        if(hits>=3){ clearInterval(SC.timer); SC.timer=null; resolve(true); }
      }else if(Date.now()-t0>8000){
        clearInterval(SC.timer); SC.timer=null; resolve(false);
      }
    },250);
  });

  if(!ok){
    updateDebug('timeout','FrameTimeout');
    showFail('摄像头没有输出画面','摄像头已连接，但 8 秒内没有画面数据。可能是浏览器限制、驱动异常或虚拟摄像头。请重试，或手动输入条码。','FrameTimeout');
    stopCamera();
    return;
  }

  // 4. 出画面
  v.style.opacity='1';
  document.getElementById('scanBusy').classList.add('hide');
  document.getElementById('scanFrame').classList.remove('hide');
  updateDebug('streaming');
  startDecode();
}

function withTimeout(promise,ms,msg){
  return Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>{
    const e=new Error(msg); e.name='TimeoutError'; rej(e);
  },ms))]);
}
function isWeChat(){ return /MicroMessenger/i.test(navigator.userAgent); }

function scanTip(txt,color){
  const el=document.getElementById('scanTipMain');
  el.textContent=txt; el.style.color=color||'#7A6A5C';
}

/* ---------- ZXing 统一解码（灰度转换是关键：直接把 RGBA 喂给 RGBLuminanceSource 会解不出） ---------- */
let _zxLib=null, _zxReader=null, _zxCv=null, _zxCtx=null;
async function zxReady(){
  if(_zxLib&&_zxReader) return _zxLib;
  const lib=await loadZXing();
  if(!lib) return null;
  _zxLib=lib;
  _zxReader=new lib.MultiFormatReader();
  const h=new Map();
  h.set(lib.DecodeHintType.POSSIBLE_FORMATS,[
    lib.BarcodeFormat.CODE_128,lib.BarcodeFormat.EAN_13,lib.BarcodeFormat.EAN_8,
    lib.BarcodeFormat.CODE_39,lib.BarcodeFormat.UPC_A,lib.BarcodeFormat.CODE_93,
    lib.BarcodeFormat.ITF,lib.BarcodeFormat.QR_CODE
  ]);
  h.set(lib.DecodeHintType.TRY_HARDER,true);
  _zxReader.setHints(h);
  return lib;
}
// src 可以是 video 也可以是 image/canvas；坐标按 src 原始像素
function zxDecode(src,sw,sh,sx,sy,cw,ch,maxW,quick){
  if(!_zxLib||!_zxReader) return null;
  const lib=_zxLib;
  sx=Math.max(0,Math.round(sx)); sy=Math.max(0,Math.round(sy));
  cw=Math.min(Math.round(cw),sw-sx); ch=Math.min(Math.round(ch),sh-sy);
  if(cw<50||ch<24) return null;
  const tw=Math.min(maxW||cw,cw), th=Math.max(1,Math.round(ch*tw/cw));
  if(!_zxCv){ _zxCv=document.createElement('canvas'); _zxCtx=_zxCv.getContext('2d',{willReadFrequently:true}); }
  if(_zxCv.width!==tw||_zxCv.height!==th){ _zxCv.width=tw; _zxCv.height=th; }
  try{
    _zxCtx.drawImage(src,sx,sy,cw,ch,0,0,tw,th);
    const d=_zxCtx.getImageData(0,0,tw,th).data;
    const gray=new Uint8ClampedArray(tw*th);
    for(let i=0,j=0;i<gray.length;i++,j+=4){ gray[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000|0; }
    for(let b=0;b<(quick?1:2);b++){
      const lum=new lib.RGBLuminanceSource(gray,tw,th);
      const bmp=new lib.BinaryBitmap(new (b?lib.GlobalHistogramBinarizer:lib.HybridBinarizer)(lum));
      try{ const r=_zxReader.decode(bmp); if(r&&r.getText()) return r.getText(); }
      catch(e){ if(b===0) SC.lastErr=(e&&(e.message||e))||''; }
    }
  }catch(e){ SC.lastErr=(e&&(e.message||e))||''; }
  SC.attempts++;
  return null;
}
// 照片识别：把照片解码成 canvas 再扫（照片比视频帧清楚得多）
function decodeImageFile(file){
  const url=URL.createObjectURL(file);
  const im=new Image();
  im.onload=async()=>{
    URL.revokeObjectURL(url);
    const lib=await zxReady();
    if(!lib){ toast('识别组件未加载，请检查网络','err'); return; }
    // 缩到最长边 2000，既保留细节又不卡
    const maxSide=2000;
    const k=Math.min(1,maxSide/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
    const ctx=cv.getContext('2d');
    ctx.drawImage(im,0,0,cv.width,cv.height);
    const W=cv.width,H=cv.height;
    let code=null;
    // 全图 → 六条横带 → 三档缩放
    code=zxDecode(cv,W,H,0,0,W,H,1600);
    if(!code){
      for(const by of [0.18,0.28,0.38,0.48,0.58,0.68]){
        const bh=Math.round(H*0.18);
        code=zxDecode(cv,W,H,0,Math.round(H*by),W,bh,1600);
        if(code) break;
      }
    }
    if(code){ const cb=SC.onScan; closeScanner(); cb&&cb(code); return; }
    toast('照片里没识别到条码，试试裁到只剩条码、或拍清楚点','err');
    scanTip('照片没解出条码：让条码占满画面、对焦清楚再拍','#B02A1D');
  };
  im.onerror=()=>{ URL.revokeObjectURL(url); toast('图片读取失败','err'); };
  im.src=url;
}

async function startDecode(){
  const v=document.getElementById('scanVideo');
  const ZX=await zxReady();          // 先确保 ZXing 就绪

  let native=null;
  if('BarcodeDetector' in window){
    try{
      const fmts=await (window.BarcodeDetector.getSupportedFormats?.()||[]);
      if(fmts.length) native=new window.BarcodeDetector({formats:fmts});
    }catch(e){ native=null; }
  }
  updateDebug('streaming 引擎:'+(native?'原生':'')+(ZX?'ZXing':''));

  if(!native&&!ZX){
    scanTip('识别组件未加载（网络异常），请用下方输入框手动输入条码','#B02A1D');
    return;
  }

  let found=false;
  const emit=code=>{
    if(found) return;
    found=true; SC.running=false;
    onCode(code);
  };

  // ① 原生 BarcodeDetector（系统级，最快）
  if(native){
    const nt=async()=>{
      if(!SC.running||found) return;
      try{
        const r=await native.detect(v);
        if(r&&r.length&&r[0].rawValue){ emit(r[0].rawValue); return; }
      }catch(e){}
      setTimeout(nt,130);
    };
    nt();
  }

  // ② ZXing：先扫画面中间（用户都对着中间放），中间不行再扫四周
  if(ZX){
    let cyc=[],ci=0;
    const rois=()=>{
      const vw=v.videoWidth,vh=v.videoHeight;
      const bw=Math.round(vw*0.94), bx=Math.round((vw-bw)/2), bandH=Math.round(vh*0.16);
      return [
        // 优先：中间三条横带 + 中心块（命中率最高，前 20ms 就有结果）
        {x:bx,y:Math.round(vh*0.40),w:bw,h:bandH,maxW:1600},
        {x:bx,y:Math.round(vh*0.50),w:bw,h:bandH,maxW:1600},
        {x:bx,y:Math.round(vh*0.32),w:bw,h:bandH,maxW:1600},
        {x:Math.round(vw*0.12),y:Math.round(vh*0.22),w:Math.round(vw*0.76),h:Math.round(vh*0.56),maxW:1300},
        // 兜底：上下各带 + 整帧
        {x:bx,y:Math.round(vh*0.20),w:bw,h:bandH,maxW:1400},
        {x:bx,y:Math.round(vh*0.62),w:bw,h:bandH,maxW:1400},
        {x:bx,y:Math.round(vh*0.10),w:bw,h:bandH,maxW:1400},
        {x:bx,y:Math.round(vh*0.74),w:bw,h:bandH,maxW:1400},
        {x:bx,y:Math.round(vh*0.86),w:bw,h:bandH,maxW:1400},
        {x:0,y:0,w:vw,h:vh,maxW:1400}
      ];
    };
    const tick=()=>{
      if(!SC.running||found) return;
      const vw=v.videoWidth,vh=v.videoHeight;
      if(vw>0&&v.readyState>=2){
        if(!cyc.length){ cyc=rois(); ci=0; }
        const t0=performance.now();
        // 每帧最多干 60ms，剩下的时间让浏览器出下一帧，避免卡死
        while(ci<cyc.length&&(performance.now()-t0)<60){
          const r=cyc[ci++];
          const quick=r.h<=Math.round(vh*0.20);        // 细横带只跑一次二值化，大区域才双试（省一半算力）
          const code=zxDecode(v,vw,vh,r.x,r.y,r.w,r.h,r.maxW,!quick);
          if(code){ emit(code); return; }
        }
        if(ci>=cyc.length) cyc=[];
      }
      setTimeout(tick,60);
    };
    tick();
  }

  // ③ 6 秒还没识别，给出具体引导
  setTimeout(()=>{
    if(SC.running&&!found){
      scanTip('还没识别到：把条码放平对准框内、占满取景框、避开反光；或用右下角「照片」拍一张导入','#B5651D');
    }
  },6000);
}
let zxLoading=null;
function loadZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(zxLoading) return zxLoading;
  zxLoading=new Promise(resolve=>{
    const s=document.createElement('script');
    s.src='https://fastly.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=()=>resolve(window.ZXing||null);
    s.onerror=()=>resolve(null);
    document.head.appendChild(s);
  });
  return zxLoading;
}
function onCode(code){
  code=String(code||'').trim();
  if(!code) return;
  if(navigator.vibrate){ try{navigator.vibrate(80)}catch(e){} }
  const cb=SC.onScan;
  closeScanner();
  if(cb) cb(code);
}

/* 扫码枪监听：全局快速连续按键 + Enter */
let gunBuf='',gunTs=0;
document.addEventListener('keydown',e=>{
  if(!document.getElementById('scanner').classList.contains('on')) return;
  if(e.key==='Enter'){
    const v=document.getElementById('scanInput').value.trim();
    if(v){ e.preventDefault(); onCode(v); }
    gunBuf='';
  }
});

/* ---------- 弹窗 ---------- */
function modal(title,html,onMount){
  const m=document.getElementById('modal');
  document.getElementById('modalPanel').innerHTML=
    `<h3>${esc(title)}<span class="sp"></span><button class="x" data-close>✕</button></h3>${html}`;
  m.classList.add('on');
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  m.querySelector('.mask').onclick=closeModal;
  if(onMount) onMount();
}
function closeModal(){
  document.getElementById('modal').classList.remove('on');
  document.getElementById('modalPanel').innerHTML='';
}

/* ---------- 启动 ---------- */
function bootUI(){
  clampStore(); renderStoreSel(); renderNav(); render(); updateBell();
}
async function init(){
  load();
  await cloudAutoStart();
  if(CUR){
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    bootUI();
  }else{
    renderLogin();
  }
  document.getElementById('lgBtn').onclick=doLogin;
  document.getElementById('lgPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('lgUser').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('lgPass').focus(); });
  bindNav();
  document.getElementById('bellBtn').onclick=()=>openNotices();
  document.getElementById('avatar').onclick=()=>{
    modal('账号',`
      <div class="list-item"><div class="g"><b>${esc(CUR.name)}</b><small>${esc(CUR.account)} · ${esc(roleOf(CUR)?.name||'')}</small></div></div>
      <div class="modal-foot"><button class="btn ghost" id="mLogout">退出登录</button>
        <button class="btn" data-close>关闭</button></div>`,()=>{
      document.getElementById('mLogout').onclick=()=>{closeModal(); logout();};
    });
  };
  // 扫码器按钮
  document.getElementById('scanClose').onclick=closeScanner;
  document.getElementById('scanSubmit').onclick=()=>{
    const v=document.getElementById('scanInput').value.trim();
    if(!v){ document.getElementById('scanInput').focus(); return; }
    onCode(v);
  };
  document.getElementById('scanInput').addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); const v=e.target.value.trim(); if(v) onCode(v); }
  });
  document.getElementById('failManual').onclick=()=>document.getElementById('scanInput').focus();
  document.getElementById('failRetry').onclick=()=>startCamera();
  document.getElementById('failSwitch').onclick=async()=>{
    try{
      const all=await navigator.mediaDevices.enumerateDevices();
      const devs=all.filter(d=>d.kind==='videoinput');
      if(devs.length<2) return;
      stopCamera();
      document.getElementById('scanBusy').classList.remove('hide');
      const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{deviceId:{exact:devs[1].deviceId}}});
      SC.stream=stream; document.getElementById('scanVideo').srcObject=stream;
      await document.getElementById('scanVideo').play().catch(()=>{});
      SC.running=true; startCameraAfterSwitch();
    }catch(e){ toast('切换失败','err'); }
  };
  // 页面隐藏时释放摄像头
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&document.getElementById('scanner').classList.contains('on')) closeScanner();
  });
}
function startCameraAfterSwitch(){
  const v=document.getElementById('scanVideo');
  const t0=Date.now(); let hits=0;
  const t=setInterval(()=>{
    if(v.videoWidth>0&&v.readyState>=2){
      hits++; if(hits>=3){ clearInterval(t); v.style.opacity='1';
        document.getElementById('scanBusy').classList.add('hide');
        document.getElementById('scanFrame').classList.remove('hide');
        updateDebug('streaming'); startDecode(); }
    }else if(Date.now()-t0>8000){ clearInterval(t); document.getElementById('scanBusy').classList.add('hide');
      showFail('摄像头没有输出画面','切换后的摄像头 8 秒内没有画面，请重试。','FrameTimeout'); stopCamera(); }
  },250);
}
init();
</script>
